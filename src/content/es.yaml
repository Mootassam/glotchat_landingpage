pages:
  home:
    title: "GlotChat – Varias Cuentas de WhatsApp + Traductor para PC"
    description: "Usa varias cuentas de WhatsApp en una ventana en Windows y traduce chats, notas de voz y fotos sin conexión en 49 idiomas. Prueba gratis de 3 días."
    og_title: "GlotChat – Todas tus cuentas de WhatsApp en una ventana, cada cliente en su idioma"
    og_heading: "Todas tus cuentas de WhatsApp en una ventana. Cada cliente en su idioma."
    short: "Inicio"
    icon: "🏠"
    blocks:
    - type: hero_home
      eyebrow: Varias cuentas de WhatsApp + traductor para Windows
      h1: Muchas cuentas de WhatsApp. <span class="grad">Una ventana. Cualquier idioma.</span>
      lead: Agrega todos tus números, recibe las notificaciones de cada cuenta y lee cada mensaje, audio y foto en tu idioma.
      micro:
      - 3 días gratis — sin pagar
      - Respuesta rápida por Telegram
      - Desde 69 USDT / año
      media_alt: GlotChat traduciendo un chat de WhatsApp entre español e inglés
      chapters:
      - id: accounts
        icon: 👥
        label: Agregar cuentas
        cap: 'Agrega cada número de WhatsApp en segundos: ponle nombre, elige tu idioma y escanea el código QR.'
      - id: notify
        icon: 🔔
        label: Notificaciones
        cap: 'Cada notificación muestra a qué cuenta llegó: haz clic y se abre el chat correcto.'
      - id: chat
        icon: 🌐
        label: Traducir chats
        cap: El cliente escribe en su idioma y tú lees en el tuyo. Tu respuesta se envía en el suyo.
      - id: voice
        icon: 🎤
        label: Audios
        cap: Con un clic, el audio se convierte en texto traducido a tu idioma.
      - id: photo
        icon: 📷
        label: Fotos
        cap: 'Fotos de facturas, pedidos y documentos: el texto se lee y se traduce.'
    - type: facts
      label: Datos clave
      items:
      - - 27+
        - cuentas de WhatsApp a la vez (probado)
      - - '49'
        - idiomas de traducción
      - - 100%
        - traducción sin conexión en tu PC
      - - 🎤 + 🖼
        - traducción de voz y fotos
    - type: showcase
      id: features
      k: Cómo funciona
      h: Mira lo que hace GlotChat en 5 videos cortos
      rows:
      - media: video:accounts
        h: Todos tus números de WhatsApp en una ventana
        p: Agrega todas las cuentas que necesites. Cada una va por separado, con su propia sesión y sus idiomas.
        ticks:
        - Escanea el QR una vez y queda conectada
        - Probado con 27 cuentas a la vez
        - WhatsApp y WhatsApp Business
      - media: video:notify
        h: Sabe a qué cuenta llega cada mensaje
        p: La notificación muestra la cuenta y el cliente, ya traducida.
        ticks:
        - '“Shop UAE · Fatima”: no se te escapa ningún número'
        - Haz clic en la notificación y se abre el chat correcto
        - Mensajes sin leer en cada pestaña
      - media: video:chat
        h: Chatea en cualquier idioma, en ambos sentidos
        p: La traducción aparece bajo el mensaje original. Tú escribes en tu idioma y el cliente recibe el suyo.
        ticks:
        - 49 idiomas
        - Revisa la traducción antes de enviar
        - El cliente ve un mensaje normal
      - media: video:voice
        h: Audios → texto en tu idioma
        p: ¿No entiendes un audio? Con un clic lo lees.
        ticks:
        - Unos 100 idiomas hablados
        - 'Funciona sin internet: el audio no sale de tu PC'
      - media: video:photo
        h: Lee el texto de fotos y documentos
        p: 'Facturas, pedidos, listas de precios, capturas: leídos y traducidos con un clic.'
        ticks:
        - Alfabeto latino, árabe, cirílico, chino y más
        - El cliente no recibe ningún aviso
      extras:
      - ⚡ Respuestas rápidas
      - 🛡 Traducción sin internet y privada
      - 🩹 Las cuentas congeladas se reinician solas
      - 🀄 Interfaz en inglés y chino
    - type: cards
      id: who
      who: true
      k: Para quién es
      h: Para empresas cuyos clientes hablan otro idioma
      p: Si atiendes clientes de distintos países por WhatsApp — en más de un número — GlotChat te ahorra horas cada día.
      cta: Cuéntanos tu negocio — obtén una prueba gratis
      items:
      - icon: 🏠
        h: Inmobiliarias
        p: Compradores extranjeros envían notas de voz y fotos de documentos. Entiéndelos al instante y no pierdas ningún cliente en el número de ningún agente.
        pair: Español ⇄ English · Русский
        link: for/real-estate
      - icon: 🩺
        h: Clínicas y turismo médico
        p: Una ventana para el número de cada coordinador. Los pacientes escriben en su idioma y tu equipo responde en el suyo.
        pair: Español ⇄ English · Deutsch
        link: for/clinics
      - icon: 🚢
        h: Exportadores y mayoristas
        p: Cotiza, negocia y da seguimiento a compradores en inglés, árabe, portugués o chino — mientras escribes en español.
        pair: Español ⇄ 中文 · العربية
        link: for/exporters
      - icon: ✈️
        h: Viajes y turismo
        p: Reservas, cambios y preguntas de turistas de todo el mundo — desde un solo PC.
        pair: Español ⇄ English · Français
        link: for/travel
      - icon: 🛒
        h: E-commerce y revendedores
        p: Un número por tienda o país, plantillas de respuesta rápida y fotos de pedidos y recibos traducidas.
        pair: Español ⇄ Português · English
      - icon: 🎧
        h: Equipos de soporte y ventas
        p: Tus agentes trabajan en su idioma; cada cliente recibe respuestas en el suyo.
        pair: Español ⇄ English · Português
      soft: true
    - type: vs
      k: Por qué GlotChat
      h: Deja de copiar y pegar en traductores
      bad_h: Sin GlotChat
      bad:
      - Un teléfono o perfil de navegador por número
      - Copiar → pegar → traducir → volver a pegar, en cada mensaje
      - Notas de voz que no entiendes
      - Mensajes perdidos en la “otra” cuenta
      - Chats de clientes pegados en traductores online
      good_h: Con GlotChat
      good:
      - Todos los números en una ventana, a un clic
      - La traducción aparece bajo cada mensaje automáticamente
      - Notas de voz convertidas en texto, en tu idioma
      - Cada notificación te dice de qué cuenta es
      - Todo traducido sin conexión, en tu propio PC
    - type: steps
      k: Prueba antes de pagar
      h: Gratis 3 días. Funcionando en 10 minutos.
      items:
      - - "Descarga GlotChat"
        - "Descarga el instalador para Windows desde nuestra web e instálalo en un minuto, sin permisos de administrador."
      - - "Empieza tu prueba gratis con un clic"
        - "Abre GlotChat y haz clic en “Start my free 3-day trial”. Todas las funciones se desbloquean al instante: sin pago y sin enviar mensajes."
      - - ¿Te encanta? Quédatelo.
        - Paga en USDT y recibe tu clave anual. Tus cuentas y ajustes quedan exactamente igual — nada que volver a configurar.
      cta: "Descargar y empezar mi prueba gratis"
    - type: plans
      k: Precios
      h: Planes anuales simples. Prueba gratis primero.
      p: Cada plan incluye todas las funciones y todas las actualizaciones. Empieza con una prueba gratis de 3 días — paga solo si te encanta.
      more: Comparar planes en detalle
      soft: false
    - type: faq
      k: Preguntas frecuentes
      h: Tus preguntas, respondidas
      items:
      - - ¿Hay prueba gratis?
        - "Sí. Descarga GlotChat, ábrelo y haz clic en “Start my free 3-day trial”: todas las funciones se desbloquean al instante, sin pagar. Si te gusta, compras un plan y conservas todas tus cuentas y ajustes."
      - - ¿Es seguro para mis cuentas de WhatsApp?
        - 'GlotChat abre el WhatsApp Web oficial de cada cuenta, en su propia sesión aislada — igual que un navegador, solo que ordenado. Nunca envía mensajes por su cuenta: todo lo envías tú. Como con cualquier uso de WhatsApp, evita el spam y los mensajes masivos no solicitados.'
      - - ¿La traducción necesita internet?
        - No. La traducción, la transcripción de voz y la lectura de fotos corren en tu PC. Descargas un paquete de idioma una vez (el inglés viene incluido). WhatsApp en sí, claro, necesita internet.
      - - ¿Qué computadora necesito?
        - 'Windows 10 u 11 (64 bits). Cada cuenta de WhatsApp usa unos 300–450 MB de memoria: 8 GB de RAM alcanzan para unas 10 cuentas; 16 GB o más para 20–30 cuentas.'
      - - ¿Qué idiomas admite?
        - 49 idiomas de traducción, entre ellos español, inglés, portugués, chino, árabe, francés, alemán, italiano, ruso, turco, hindi, japonés y coreano. Los mensajes de voz se reconocen en unos 100 idiomas.
      - - ¿Funciona con WhatsApp Business?
        - Sí. Se pueden vincular cuentas de WhatsApp y de WhatsApp Business, igual que vinculas WhatsApp Web.
      - - ¿Cómo pago y recibo el programa?
        - Escríbenos por Telegram, elige tu plan y paga en USDT (TRC20, BEP20 o ERC20). Recibes el instalador y tu clave de licencia, y te ayudamos a configurarlo si lo necesitas.
      - - ¿Funciona en Mac o en el móvil?
        - GlotChat es una aplicación de escritorio para Windows. Tus teléfonos siguen funcionando normalmente — GlotChat es un dispositivo vinculado, como WhatsApp Web.
    - type: related
      k: Saber más
      h: Guías y comparativas
      items:
      - guides/multiple-whatsapp-accounts-on-pc
      - guides/translate-whatsapp-messages-on-pc
      - compare

