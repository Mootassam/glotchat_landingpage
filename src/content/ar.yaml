        h: المصدّرون وتجار الجملة
        p: قدّم الأسعار وتفاوض وتابع مع المشترين بالإسبانية أو الروسية أو الصينية — وأنت تكتب بلغتك.
        pair: العربية ⇄ 中文 · Español
        link: for/exporters
      - icon: ✈️
        h: السفر والسياحة
        p: حجوزات وتعديلات واستفسارات من سياح من كل العالم — من جهاز واحد.
        pair: العربية ⇄ English · Français
        link: for/travel
      - icon: 🛒
        h: التجارة الإلكترونية والموزعون
        p: رقم لكل متجر أو دولة، وقوالب ردود سريعة، وترجمة صور الطلبات والإيصالات.
        pair: العربية ⇄ English · Español
      - icon: 🎧
        h: فرق الدعم والمبيعات
        p: يعمل موظفوك بلغتهم، ويحصل كل عميل على الرد بلغته.
        pair: العربية ⇄ English · Français
      soft: true
    - type: vs
      k: لماذا GlotChat
      h: توقف عن النسخ واللصق في المترجمات
      bad_h: بدون GlotChat
      bad:
      - هاتف أو ملف متصفح لكل رقم
      - نسخ ← لصق ← ترجمة ← لصق مرة أخرى، لكل رسالة
      - رسائل صوتية لا تفهمها
      - رسائل فائتة على الحساب «الآخر»
      - محادثات العملاء تُلصق في مترجمات على الإنترنت
      good_h: مع GlotChat
      good:
      - كل الأرقام في نافذة واحدة، على بعد نقرة
      - الترجمة تظهر تحت كل رسالة تلقائيًا
      - الرسائل الصوتية تتحول إلى نص بلغتك
      - كل إشعار يخبرك بالحساب الذي يخصه
      - كل شيء يُترجم بدون إنترنت، على جهازك
    - type: steps
      k: جرّب قبل أن تدفع
      h: مجاني لمدة 3 أيام. جاهز خلال 10 دقائق.
      items:
      - - راسلنا على تيليجرام
        - أخبرنا كم حساب واتساب تستخدم. نرسل لك برنامج التثبيت ونجيب عن كل أسئلتك.
      - - احصل على مفتاح التجربة المجانية
        - ثبّت GlotChat وأرسل لنا «معرّف الجهاز» الذي يظهر لك، واستلم مفتاحًا لمدة 3 أيام بكل المزايا.
      - - أعجبك؟ احتفظ به.
        - ادفع بعملة USDT واحصل على مفتاحك السنوي. حساباتك وإعداداتك تبقى كما هي — لا شيء لإعادة إعداده.
      cta: احصل على تجربتي المجانية عبر تيليجرام
    - type: plans
      k: الأسعار
      h: باقات سنوية بسيطة. جرّب مجانًا أولًا.
      p: كل باقة تشمل كل المزايا وكل التحديثات. ابدأ بتجربة مجانية 3 أيام — وادفع فقط إذا أعجبك.
      more: قارن الباقات بالتفصيل
      soft: false
    - type: faq
      k: الأسئلة الشائعة
      h: إجابات أسئلتك
      items:
      - - هل توجد تجربة مجانية؟
        - نعم. راسلنا على تيليجرام وستحصل على مفتاح تجربة لمدة 3 أيام بكل المزايا — بدون أي دفع. إذا أعجبك، تشتري باقة وتحتفظ بكل حساباتك وإعداداتك.
      - - هل هو آمن لحسابات واتساب الخاصة بي؟
        - 'يفتح GlotChat واتساب ويب الرسمي لكل حساب، في جلسة معزولة خاصة به — تمامًا مثل المتصفح لكن بشكل منظم. لا يرسل أي رسالة من تلقاء نفسه: كل شيء ترسله أنت. وكما في أي استخدام لواتساب، تجنّب الرسائل المزعجة والجماعية غير المرغوبة.'
      - - هل تحتاج الترجمة إلى إنترنت؟
        - لا. الترجمة وتفريغ الصوتيات وقراءة الصور تعمل على جهازك. تحمّل حزمة اللغة مرة واحدة فقط (الإنجليزية مضمنة). وبالطبع يحتاج واتساب نفسه إلى الإنترنت.
      - - ما الجهاز الذي أحتاجه؟
        - 'ويندوز 10 أو 11 (64 بت). كل حساب واتساب يستخدم حوالي 300–450 ميجابايت من الذاكرة: 8 جيجابايت تكفي لحوالي 10 حسابات، و16 جيجابايت أو أكثر لـ 20–30 حسابًا.'
      - - ما اللغات المدعومة؟
        - 49 لغة للترجمة، منها العربية والإنجليزية والصينية والإسبانية والفرنسية والألمانية والبرتغالية والروسية والتركية والهندية والفارسية والأردية. والرسائل الصوتية تُفهم بحوالي 100 لغة.
      - - هل يعمل مع واتساب للأعمال؟
        - نعم. يمكن ربط حسابات واتساب وواتساب للأعمال، بالطريقة نفسها التي تربط بها واتساب ويب.
      - - كيف أدفع وأستلم البرنامج؟
        - راسلنا على تيليجرام، اختر باقتك وادفع بعملة USDT (TRC20 أو BEP20 أو ERC20). تستلم برنامج التثبيت ومفتاح الترخيص، ونساعدك في الإعداد إذا احتجت.
      - - هل يعمل على ماك أو الهاتف؟
        - ‏GlotChat برنامج لويندوز. هواتفك تعمل بشكل طبيعي — GlotChat جهاز مرتبط مثل واتساب ويب.
