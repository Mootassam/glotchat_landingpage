      - كل شيء يُترجم بدون إنترنت على جهازك
    - type: steps
      k: جرّب قبل أن تدفع
      h: مجانًا لمدة 3 أيام. جاهز خلال 10 دقائق.
      items:
      - - حمّل GlotChat
        - احصل على مُثبّت ويندوز من موقعنا وثبّته في حوالي دقيقة — بدون صلاحيات مسؤول.
      - - ابدأ تجربتك المجانية بنقرة
        - افتح GlotChat واضغط «ابدأ تجربتي المجانية لمدة 3 أيام». كل الميزات تُفعّل فورًا — بدون دفع أو رسائل.
      - - أعجبك؟ احتفظ به
        - ادفع بـ USDT واحصل على مفتاحك السنوي. حساباتك وإعداداتك تبقى كما هي — لا شيء لتعيد إعداده.
      cta: حمّل وابدأ تجربتي المجانية
    - type: plans
      k: الأسعار
      h: باقات سنوية بسيطة. جرّب مجانًا أولًا.
      p: كل باقة تشمل كل الميزات وكل التطبيقات وكل التحديثات. ابدأ بتجربة مجانية 3 أيام — وادفع فقط إن أعجبك.
      more: قارن الباقات بالتفصيل
      soft: false
    - type: faq
      k: الأسئلة الشائعة
      h: إجابات أسئلتك
      items:
      - - هل توجد تجربة مجانية؟
        - نعم. حمّل GlotChat وافتحه واضغط «ابدأ تجربتي المجانية لمدة 3 أيام» — كل الميزات تُفعّل فورًا بدون دفع. إن أعجبك تشتري باقة وتحتفظ بكل حساباتك وإعداداتك.
      - - ما التطبيقات التي يعمل معها؟
        - واتساب وواتساب للأعمال وتيليجرام وماسنجر فيسبوك ورسائل إنستغرام وديسكورد و BAND — عدة حسابات من كل تطبيق في نافذة واحدة. المحادثات تُترجم في الاتجاهين في كل التطبيقات؛ والرسائل الصوتية والصور في واتساب وتيليجرام.
      - - هل هو آمن لحساباتي؟
        - 'يفتح GlotChat الموقع الرسمي لكل تطبيق (واتساب ويب، تيليجرام ويب، ماسنجر، إنستغرام، ديسكورد، BAND) لكل حساب في جلسة معزولة خاصة به — تمامًا مثل المتصفح، لكن بتنظيم أفضل. لا يرسل أي رسالة من تلقاء نفسه: أنت من يرسل كل شيء. وكما مع أي تطبيق مراسلة، تجنّب الرسائل المزعجة والجماعية غير المرغوب فيها.'
      - - ما جودة الترجمة؟
        - 'ممتازة لمحادثات العمل اليومية — الأسعار والطلبات والمواعيد والأسئلة. ولن تحتاج إلى التخمين: قبل الإرسال يعرض GlotChat ما سيقرؤه العميل، ويفحص كل رقم، ويقترح صياغات أخرى. للعقود أو المصطلحات الطبية، راجع النصوص المهمة مع شخص مختص.'
      - - هل تحتاج الترجمة إلى الإنترنت؟
        - لا. الترجمة وتفريغ الصوت وقراءة الصور تعمل على جهازك. تحمّل حزمة اللغة مرة واحدة (الإنجليزية مدمجة). أما واتساب وتيليجرام نفسهما فيحتاجان إلى الإنترنت بالطبع.
      - - ما الكمبيوتر الذي أحتاجه؟
        - 'ويندوز 10 أو 11 (64 بت). كل حساب يستخدم حوالي 300–450 ميغابايت من الذاكرة: 8 غيغابايت تكفي لنحو 10 حسابات، و16 غيغابايت أو أكثر لـ 20–30 حسابًا.'
      - - كيف أدفع وأحصل على البرنامج؟
        - حمّل التجربة المجانية من هذا الموقع. عندما تكون جاهزًا، راسلنا على تيليجرام واختر باقتك وادفع بـ USDT (TRC20 أو BEP20 أو ERC20). يصلك مفتاح الترخيص خلال دقائق، ونساعدك في الإعداد إن احتجت.
      - - هل يعمل على ماك أو الهاتف؟
        - GlotChat تطبيق لويندوز. هواتفك تبقى تعمل كالمعتاد — GlotChat جهاز مرتبط مثل واتساب ويب أو تيليجرام للكمبيوتر.
