      - - ترجمة مدمجة
        - ✕
        - ✕
        - ✕
        - ✓ 49 لغة
      - - التكلفة
        - مجاني
        - مجاني
        - مجاني / مدفوع
        - من 69 USDT سنويًا
      note: الطرق المجانية تكفي لرقمين أو ثلاثة. GlotChat لمن يدير أرقامًا كثيرة — ويتحدث مع عملاء بلغات أخرى.
    - type: faq
      soft: true
      k: الأسئلة الشائعة
      h: حسابات واتساب متعددة — أسئلة
      items:
      - - كم حساب واتساب يمكنني تشغيله على كمبيوتر واحد؟
        - 'اختبرنا 27 حسابًا في الوقت نفسه. الحد الحقيقي هو الذاكرة: كل حساب يستخدم حوالي 300–450 ميغابايت، فـ 8 غيغابايت تكفي لنحو 10 حسابات و16 غيغابايت أو أكثر لـ 20–30.'
      - - هل أحتاج هاتفًا لكل حساب؟
        - نعم. كل حساب واتساب مرتبط برقم هاتف، وتربطه مرة واحدة بمسح رمز QR بذلك الهاتف. لا يلزم بقاء الهاتف بجانب الكمبيوتر.
      - - هل يمكن لكل حساب استخدام بروكسي خاص؟
        - نعم. افتح إعدادات الحساب والصق البروكسي (http:// أو socks5://، مع اسم المستخدم وكلمة المرور إن لزم). يفحصه GlotChat وينبهك إن توقف.
      - - هل ستُحظر حساباتي؟
        - يستخدم GlotChat واتساب ويب الرسمي، فهو مثل استخدام واتساب في المتصفح. الحظر يأتي من سلوك يمنعه واتساب — الرسائل المزعجة والجماعية والتطبيقات المعدّلة. استخدم حساباتك بشكل طبيعي ولن تواجه مشكلة.
      - - هل يعمل مع واتساب للأعمال؟
        - نعم — يمكن ربط حسابات واتساب وواتساب للأعمال معًا.
