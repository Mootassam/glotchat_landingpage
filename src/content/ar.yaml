    - type: cards
      id: who
      who: true
      k: لمن هو
      h: مصمم للشركات التي يتحدث عملاؤها لغة أخرى
      p: إذا كنت ترد على عملاء واتساب من دول مختلفة — وعلى أكثر من رقم — فإن GlotChat يوفر لك ساعات كل يوم.
      cta: أخبرنا عن نشاطك — واحصل على تجربة مجانية
      items:
      - icon: 🏠
        h: الوكالات العقارية
        p: المشترون الأجانب يرسلون رسائل صوتية وصور مستندات. افهمها فورًا ولا تفوّت أي عميل على رقم أي وسيط.
