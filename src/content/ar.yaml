          - ["كيف أترجم رسالة واتساب صوتية على الكمبيوتر؟", "حوّلها إلى نص أولًا ثم ترجمها. ‏GlotChat يقوم بالخطوتين بنقرة واحدة، بدون إنترنت، لحوالي 100 لغة منطوقة."]
