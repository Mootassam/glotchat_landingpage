  whatsapp-translator:
    title: مترجم واتساب للكمبيوتر – المحادثات والصوت والصور بدون إنترنت
    description: 'ترجم محادثات واتساب في الاتجاهين على الكمبيوتر: الرسائل والرسائل الصوتية والنص في الصور، بـ 49 لغة بدون إنترنت — مع مراجعة قبل الإرسال.'
    keywords: مترجم واتساب, ترجمة رسائل واتساب, ترجمة واتساب على الكمبيوتر, ترجمة الرسائل الصوتية واتساب, ترجمة تلقائية واتساب
    short: مترجم واتساب
    icon: 🌐
    og_heading: مترجم واتساب للكمبيوتر — المحادثات والصوت والصور بدون إنترنت
    blocks:
    - type: hero
      k: مترجم واتساب للكمبيوتر
      h1: ترجم كل محادثة واتساب — <span class="grad">في الاتجاهين، داخل واتساب نفسه</span>
      lead: رسائل العملاء تُترجم تحت النص الأصلي. ردودك تُترجم قبل إرسالها — وترى ما سيقرؤه العميل. الرسائل الصوتية والصور أيضًا، بـ 49 لغة، بدون إنترنت على جهازك.
      media: video:chat
      media_alt: محادثة واتساب مترجمة من الإسبانية إلى العربية داخل GlotChat
    - type: steps
      id: how
      soft: false
      k: كيف يعمل
      h: ثلاثة أشياء تحدث في كل محادثة
      items:
      - - يكتبون بلغتهم
        - كل رسالة واردة تظهر ترجمتها تحت النص الأصلي — تلقائيًا فور وصولها.
      - - تكتب أنت بالعربية
        - اكتب ردك بلغتك واضغط Enter. يعرض GlotChat الترجمة وما سيقرؤه العميل.
      - - يستلمون بلغتهم
        - يتلقى العميل نصًا طبيعيًا بلغته. وفي محادثتك ترى ما كتبته.
    - type: cards
      soft: true
      k: ليس النص فقط
      h: كل ما يرسله العميل يصبح مفهومًا
      items:
      - icon: 💬
        h: الرسائل النصية
        p: ترجمة تلقائية لكل رسالة واردة مع الاحتفاظ بالأصل. يفهم اختصارات المحادثات والأحرف الكبيرة واللهجات العربية.
      - icon: 🎤
        h: الرسائل الصوتية
        p: حوّل الرسائل الصوتية إلى نص وترجمها — حوالي 100 لغة منطوقة، مع تقدّم مباشر للطويلة.
      - icon: 🖼
        h: الصور ولقطات الشاشة
        p: اقرأ النص في الفواتير وقوائم الأسعار والهويات ولقطات الشاشة — لاتيني وعربي وسيريلي وصيني وكوري وتايلندي وغيرها.
      - icon: ↩
        h: مراجعة «سيقرأ»
        p: قبل الإرسال، ترى ترجمتك مترجمة عكسيًا إلى العربية — واختر صياغة أخرى بنقرة.
      - icon: 🔢
        h: الأرقام تبقى صحيحة
        p: الأسعار والكميات والتواريخ وأرقام الهواتف والروابط تُفحص في كل ترجمة. أسماؤك التجارية لا تُترجم أبدًا.
      - icon: 🛡
        h: خصوصية من الأساس
        p: الترجمة تتم على جهازك. رسائل عملائك لا تُرسل أبدًا إلى Google أو DeepL أو أي خدمة ذكاء اصطناعي.
    - type: split
      k: راجع قبل الإرسال
      h: لا ترسل أبدًا ترجمة لا تستطيع قراءتها
      p: اضغط Enter فيعرض GlotChat الترجمة في نافذة معاينة صغيرة، وتحتها النص نفسه مترجمًا عكسيًا إلى العربية. إذا كان رقم ما مفقودًا يظهر تنبيه واضح — وفي الوضع التلقائي تنتظرك الرسالة بدل أن تُرسل.
      ticks:
      - «سيقرأ» يتحدّث أثناء تعديل الترجمة
      - «صياغة أخرى» تقترح عدة طرق للتعبير
      - أرسل النص الأصلي بدلًا منها بنقرة
      mock:
        top: <span>إرسال بـ <b>الإسبانية</b></span><span>من العربية</span>
        main: ¡Sí, tenemos la talla L! El envío a Madrid es gratis esta semana.
        notes:
        - - back
          - '↩ سيقرأ: نعم، لدينا المقاس L! الشحن إلى مدريد مجاني هذا الأسبوع.'
        - - info
          - 'كتبتَ: نعم عندنا مقاس L والشحن لمدريد مجاني هالأسبوع'
    - type: langs
      k: 49 لغة
      h: ترجم بين أي من هذه اللغات
      p: أي زوج يعمل — العربية إلى الصينية، التركية إلى الإسبانية، الروسية إلى البرتغالية. الرسائل الصوتية تُفهم بحوالي 100 لغة منطوقة.
    - type: related
      k: "أزواج اللغات"
      h: "أزواج لغات شائعة"
      items: ["translate/arabic-english", "how-to-buy", "is-it-safe"]
    - type: faq
      soft: true
      k: الأسئلة الشائعة
      h: أسئلة عن مترجم واتساب
      items:
      - - هل يمكن ترجمة رسائل واتساب تلقائيًا على الكمبيوتر؟
        - نعم. يترجم GlotChat كل رسالة واردة تلقائيًا ويعرض الترجمة تحت الأصل، في كل محادثة وعلى كل حساب تضيفه.
      - - هل يعرف العميل أنني أستخدم مترجمًا؟
        - لا. يتلقى رسالتك بلغته فقط، ولا يُضاف شيء إلى المحادثة.
      - - كيف أعرف أن الترجمة صحيحة؟
        - قبل الإرسال يعرض GlotChat ترجمتك مترجمة عكسيًا إلى لغتك («سيقرأ»)، ويفحص كل سعر وتاريخ ورقم هاتف، ويقترح صياغات أخرى إن أردت.
      - - هل يترجم الرسائل الصوتية في واتساب؟
        - 'نعم. اضغط «تفريغ» تحت الرسالة الصوتية: يحوّلها GlotChat إلى نص ويترجمها بدون إنترنت. يفهم حوالي 100 لغة منطوقة، والرسائل الطويلة تعرض تقدّمها.'
      - - هل أحتاج إلى الإنترنت للترجمة؟
        - مرة واحدة فقط لتحميل كل حزمة لغة. بعدها تعمل الترجمة بدون إنترنت.
      - - هل يترجم تيليجرام أيضًا؟
        - نعم — نفس الترجمة تعمل في حسابات تيليجرام. راجع صفحة مترجم تيليجرام.
    - type: related
      k: تابع الاستكشاف
      h: ذو صلة
      items:
      - telegram-translator
      - guides/translate-whatsapp-messages-on-pc
      - pricing
  multiple-whatsapp-accounts:
    title: حسابات واتساب متعددة على كمبيوتر واحد – في نافذة واحدة
    description: شغّل 2 أو 10 أو أكثر من 27 حساب واتساب جنبًا إلى جنب على ويندوز. جلسات معزولة وبروكسي وإشعارات لكل حساب، مع ترجمة مدمجة.
    keywords: حسابات واتساب متعددة, واتساب متعدد الحسابات, تشغيل حسابين واتساب على الكمبيوتر, عدة أرقام واتساب
    short: حسابات واتساب متعددة
    icon: 🗂
    og_heading: كل أرقام واتساب في نافذة واحدة على الكمبيوتر
    blocks:
    - type: hero
      k: حسابات واتساب متعددة على الكمبيوتر
      h1: كل رقم واتساب يستخدمه نشاطك — <span class="grad">في نافذة واحدة</span>
      lead: توقّف عن التنقل بين الهواتف وملفات المتصفح وتبويبات واتساب ويب. يشغّل GlotChat كل حساب في جلسة مغلقة خاصة به، ويوضح لأي رقم كل إشعار، وينقلك بينها فورًا.
      media: video:accounts
      media_alt: عدة حسابات واتساب جنبًا إلى جنب في GlotChat
    - type: facts
      label: حقائق أساسية
      items:
      - - 27+
        - حسابًا مُختبرًا معًا
      - - '1'
        - نافذة لها كلها
      - - بروكسي
        - لكل حساب إن أردت
      - - '0'
        - خلط بين الحسابات
    - type: cards
      id: features
      k: مصمم للأرقام الكثيرة
      h: كل ما تحتاجه لإدارة حسابات كثيرة بهدوء
      items:
      - icon: 🔒
        h: جلسات معزولة
        p: لكل حساب تسجيل دخوله وملفات تعريفه وتخزينه — كأنها أجهزة منفصلة في تطبيق واحد.
      - icon: 🌍
        h: بروكسي لكل حساب
        p: امنح أي حساب بروكسي HTTP أو SOCKS5 خاصًا به. يفحصه GlotChat كل دقيقة وينبهك إن توقف.
      - icon: 🔔
        h: إشعارات لكل حساب
        p: كل إشعار يذكر الحساب الذي يخصّه — ومترجم مسبقًا. اضغط عليه فتُفتح المحادثة الصحيحة.
      - icon: 🏷
        h: أسماء وألوان وصور
        p: سمِّ الحسابات حسب المتجر أو الدولة أو الموظف — «متجر الإمارات» أو «عيادة ألمانيا» أو «أحمد — مبيعات». تظهر صورة ورقم واتساب.
      - icon: 🩹
        h: إصلاح ذاتي
        p: إذا توقف حساب أو تعطل يُعاد تشغيله تلقائيًا، والبقية تستمر بالعمل.
      - icon: 💤
        h: خفيف على جهازك
        p: الحسابات قليلة الاستخدام تنام حتى تفتحها، فتبقى أجهزة 4–8 غيغابايت سريعة.
    - type: split
      soft: true
      k: كيف يعمل
      h: واتساب ويب الحقيقي، لكن منظّم
      p: يفتح GlotChat واتساب ويب الرسمي لكل حساب. تربط كل حساب مرة واحدة بمسح رمز QR بهاتفه (واتساب ← الأجهزة المرتبطة). بعدها تبقى الحسابات متصلة حتى بعد إعادة التشغيل.
      ticks:
      - يعمل مع واتساب وواتساب للأعمال
      - هواتفك تعمل كالمعتاد
      - GlotChat لا يرسل شيئًا من تلقاء نفسه — أنت المتحكم
      media: video:notify
      alt: إشعارات من عدة حسابات واتساب في GlotChat
    - type: table
      k: خياراتك
      h: طرق استخدام عدة حسابات واتساب على الكمبيوتر
      hl: 4
      cols:
      - ''
      - واتساب للكمبيوتر + ويب
      - ملفات المتصفح
      - محاكيات الهاتف
      - GlotChat
      rows:
      - - الحسابات
        - '2'
        - عدة، كل واحد بنافذة
        - عدة، ثقيلة على الجهاز
        - 27+ مُختبر، نافذة واحدة
      - - الإشعار يذكر الحساب
        - '~'
        - '~'
        - ✕
        - ✓
      - - بروكسي لكل حساب
        - ✕
