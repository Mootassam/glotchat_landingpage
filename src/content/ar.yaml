        tip: كل الميزات مفتوحة أثناء التجربة. بدون بطاقة، بدون دفع، ولا شيء لإلغائه. واجهة البرنامج بالإنجليزية أو الصينية.
        mock: activate
      - h: أضف حسابات واتساب
        p: أضف حساباً وامسح رمز QR بهاتفك (واتساب ← <b>الأجهزة المرتبطة</b>). كرر ذلك لكل رقم. تُترجم الرسائل والملاحظات الصوتية والصور فوراً.
        mock: accounts
    - type: dl_specs
      k: قبل التثبيت
      h: متطلبات النظام والأمان
      req_h: متطلبات النظام
      req:
      - - نظام التشغيل
        - Windows 10 أو 11 (64 بت)
      - - الذاكرة (RAM)
        - 4 GB · و 8 GB لأكثر من 10 حسابات
      - - مساحة فارغة
        - 2 GB
      - - الإنترنت
        - مطلوب لواتساب (الترجمة بدون إنترنت)
      - - صلاحيات المسؤول
        - غير مطلوبة
      - - أحدث إصدار
        - '{version} · {size} MB'
      safe_h: آمن ونظيف
      safe:
      - ملف رسمي يُحمّل فقط من <b>download.glotchat.com</b>
      - بدون إعلانات أو أشرطة أدوات أو برامج مرفقة
      - واتساب ويب الرسمي يعمل داخله — محادثاتك تبقى على جهازك
      - التحديثات تُثبّت تلقائياً وهي موقّعة رقمياً
      - يمكنك إزالته في أي وقت من إعدادات Windows ← التطبيقات
    - type: faq
      soft: true
      k: أسئلة التحميل
      h: أسئلة عن التحميل والتثبيت
      open_first: true
      items:
      - - هل تحميل GlotChat مجاني؟
        - نعم. التحميل مجاني، والتجربة لمدة 3 أيام تفتح كل الميزات بدون دفع. بعد التجربة تبدأ الباقات من 69 USDT في السنة.
      - - لماذا يظهر “قام Windows بحماية الكمبيوتر”؟
        - يعرض Windows SmartScreen هذا التحذير للبرامج الجديدة التي لم يرها كثيراً بعد. اضغط <b>مزيد من المعلومات</b> ثم <b>التشغيل على أي حال</b>. حمّل GlotChat دائماً من هذه الصفحة — ويمكنك مقارنة بصمة SHA-256 للتأكد أن الملف أصلي.
      - - هل أحتاج مفتاح ترخيص؟
        - نعم، يطلب GlotChat مفتاحاً عند فتحه أول مرة. اضغط <b>Get a free 3-day trial</b> داخل البرنامج ونرسل لك مفتاح تجربة مجاني على تيليجرام خلال دقائق. وعند شراء باقة تحصل على مفتاح سنوي بنفس الطريقة.
      - - هل يوجد إصدار لماك أو أندرويد أو آيفون؟
        - ليس حالياً. GlotChat برنامج لويندوز 10 و 11. تبقى أرقام واتساب على هواتفك — وGlotChat يربطها بالكمبيوتر مثل واتساب ويب.
      - - هل يعمل على Windows 7 أو 8؟
        - لا. يحتاج GlotChat إلى Windows 10 أو Windows 11 بنظام 64 بت.
      - - كيف أحدّث GlotChat؟
        - لا تحتاج لفعل شيء. يبحث GlotChat عن الإصدارات الجديدة بنفسه، ويحمّلها في الخلفية ويثبّتها عند تشغيله في المرة القادمة.
      - - كيف أزيل GlotChat؟
        - افتح <b>إعدادات Windows ← التطبيقات ← التطبيقات المثبتة</b>، وابحث عن GlotChat واضغط <b>إلغاء التثبيت</b>.
      - - توقف التحميل أو كان بطيئاً. ماذا أفعل؟
        - اضغط زر التحميل مرة أخرى. إذا استمرت المشكلة راسلنا على تيليجرام ونرسل لك ملف التثبيت مباشرة.
