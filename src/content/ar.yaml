        link: for/real-estate
      - icon: 🩺
        h: العيادات والسياحة العلاجية
        p: نافذة واحدة لأرقام كل المنسقين. المرضى يكتبون بلغتهم، وفريقك يرد بلغتهم.
        pair: العربية ⇄ Türkçe · Deutsch
        link: for/clinics
