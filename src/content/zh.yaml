        cls: ig
        name: Instagram 私信
        p: 你运营的每个 Instagram 账号的私信并排显示。客户消息自动翻译，你的回复用客户的语言发出。
        link: instagram-dm-translator
        more: Instagram 私信翻译
      - icon: dc
        cls: dc
        name: Discord
        p: 多个 Discord 账号的服务器和私信，每条消息和你写的内容都能翻译。
        link: discord-translator
        more: Discord 翻译器
      note: 所有套餐都包含这 5 个应用。每个应用都翻译文字消息；语音和图片翻译在 WhatsApp 和 Telegram 中可用。
      link:
      - all-in-one-messenger
      - 查看 GlotChat 在每个应用中的功能
    - type: showcase
      id: features
      k: 功能演示
      h: 看看 GlotChat 怎么工作 —— 几段短视频
      rows:
      - media: video:accounts
        h: 所有号码、所有账号，一个窗口
        p: 需要多少个 WhatsApp 和 Telegram 账号就加多少个。每个账号独立：独立登录、颜色、语言和通知。
        ticks:
        - 扫码一次，保持登录
        - 实测 27 个账号同时运行
        - 可为每个账号设置代理，每分钟自动检测
      - media: video:telegram
        tag: 1.3 新功能
        h: Telegram 也能像 WhatsApp 一样翻译
        p: 打开一个 Telegram 聊天，每条消息都已经翻译成中文。你用中文回复，客户收到他的语言。
        ticks:
        - 扫码或手机号登录
        - 每条消息下方显示翻译，双向翻译
        - 快捷回复模板在 Telegram 中同样可用
        link:
        - telegram-translator
        - 了解 Telegram 翻译器
      - media: video:apps
        tag: 1.3 新功能
        h: Messenger、Instagram 和 Discord —— 同一个窗口
        p: Facebook 和 Marketplace 的买家、Instagram 粉丝、Discord 成员 —— 每个聊天双向翻译，就在你的 WhatsApp 和 Telegram 账号旁边。
        ticks:
        - 每个应用可添加多个账号，彼此隔离
        - 每个应用和账号都显示未读数
        - 回复在发送前核对
        link:
        - all-in-one-messenger
        - 了解聚合聊天软件
      - media: video:chat
        h: 发送前就知道客户会读到什么
        p: 用中文写好，按 Enter。GlotChat 显示译文，并把译文再翻译回中文，让你确认意思没有变。
        ticks:
        - 每条译文下方都有“对方将读到”核对
        - 自动检查价格、日期和电话号码
        - “换个说法”提供几种不同表达
      - media: video:voice
        h: 语音消息 → 中文文字
        p: 听不懂语音？点一下就能看文字 —— 即使是 5 分钟的长语音，也会显示进度，文字边转边出现。
        ticks:
        - 约 100 种口语语言
        - 离线处理，音频不离开你的电脑
        - 一键复制转写内容或译文
      - media: video:photo
        h: 识别图片和文件里的文字
        p: 发票、订单、价目表、截图 —— 一键识别并翻译。
        ticks:
        - 拉丁文、阿拉伯文、西里尔文、中文等
        - 客户不会收到任何提示
      extras:
      - ⚡ 快捷回复模板
      - 🔔 通知显示账号名称
      - 🛡 离线、私密翻译
      - 🩹 卡住的账号自动重启
      - 🀄 中文和英文界面
    - type: trust
      id: trust
      k: 可以信赖的翻译
      h: 一个错误的价格就可能丢掉客户。GlotChat 会检查每一条译文。
      p: 机器翻译速度快，但并不完美。所以 GlotChat 在翻译前先整理聊天式的写法，在发送前再检查结果。
      items:
      - h: 清楚看到客户将读到的内容
        p: 每条译文下方，GlotChat 都会把它再翻译回中文。如果意思变了，你会比客户先发现 —— 可以直接修改，或换一种说法。
        wide: true
        mock:
          top: <span>以 <b>阿拉伯语</b> 发送</span><span>原文：中文</span>
          input: 周五前能发 3 箱吗？总共 45 美元
          main: هل يمكنك إرسال 3 صناديق بحلول يوم الجمعة؟ المجموع 45 دولارًا
          rtl: true
          notes:
          - - back
            - ↩ 对方将读到：周五前能发 3 箱吗？总共 45 美元
      - h: 价格和数字绝不会被改错
        p: 价格、数量、日期、时间、订单号、电话号码和链接，每条译文都会检查。被改动的数字会自动改回；缺少的数字会提醒你。
        mock:
          input: '订单 #4521：1,250.50 欧元。下午 3:30 打 +33 6 12 34 56 78。'
          arrow: true
          main: 'Commande n° 4521 : 1 250,50 EUR. Appelez le +33 6 12 34 56 78 à 15h30.'
          notes:
          - - ok
            - ✓ 4521 · 1,250.50 · +33 6 12 34 56 78 —— 全部保留
      - h: 看得懂真实的聊天写法
        p: “how r u pls send ur address thx”、全大写、“hiiiii”、阿拉伯语方言 —— GlotChat 先把这些整理成规范句子，再交给翻译。
        mock:
          input: how r u? pls send ur address thx
          arrow: true
          main: 你好吗？请把你的地址发给我，谢谢
          notes:
          - - info
            - 阿拉伯语方言也可以：“مرحبااااا كيفك” → “你好，最近怎么样？”
      - h: 不满意？换个说法
        p: 点一下“换个说法”，就能看到几种不同的表达方式 —— 每一种都附带回译。
        mock:
          top: <span>🔁 <b>换个说法</b></span><span>法语</span>
          chips:
          - Pouvez-vous m'envoyer la liste des prix aujourd'hui ?
          - Tu peux m'envoyer la liste des prix aujourd'hui ?
