    og_heading: "所有 WhatsApp 账号，一个窗口搞定。每位客户，都用他的语言沟通。"
    short: "首页"
    icon: "🏠"
    blocks:
    - type: hero_home
      eyebrow: Windows 版 WhatsApp 多开 + 翻译
      h1: 多个 WhatsApp 账号，<span class="grad">一个窗口，任何语言。</span>
      lead: 添加所有号码，每个账号都有自己的通知；每条消息、语音和图片都翻译成你的语言。
      micro:
      - 3 天免费 · 无需付款
      - Telegram 快速回复
      - 低至 69 USDT / 年
      media_alt: GlotChat 在中文与西班牙语之间翻译 WhatsApp 聊天
      chapters:
      - id: accounts
        icon: 👥
        label: 添加账号
        cap: 几秒添加一个 WhatsApp 号码：起名、选择语言、扫码即可。
      - id: notify
        icon: 🔔
        label: 通知
        cap: 每条通知都显示来自哪个账号 — 点击即可打开对应的聊天。
      - id: chat
        icon: 🌐
        label: 聊天翻译
        cap: 客户用他们的语言写，你看到的是你的语言；你的回复以客户的语言发出。
      - id: voice
        icon: 🎤
        label: 语音消息
        cap: 一键把语音转成文字，并翻译成你的语言。
      - id: photo
        icon: 📷
        label: 图片
        cap: 发票、订单、文件照片：识别图中文字并翻译。
    - type: facts
      label: 关键数据
      items:
      - - 27+
        - 个 WhatsApp 账号同时运行（实测）
      - - '49'
        - 种翻译语言
      - - 100%
        - 在你的电脑上离线翻译
      - - 🎤 + 🖼
        - 语音和图片翻译
    - type: showcase
      id: features
      k: 功能演示
      h: 5 段短视频，看懂 GlotChat
      rows:
      - media: video:accounts
        h: 所有 WhatsApp 号码，一个窗口
        p: 需要多少账号就添加多少。每个账号相互独立，有自己的登录和语言设置。
        ticks:
        - 扫码一次，保持登录
        - 已测试 27 个账号同时运行
        - 支持 WhatsApp 和 WhatsApp Business
      - media: video:notify
        h: 每条消息来自哪个账号，一目了然
        p: 通知显示账号和客户名称 — 并且已经翻译好。
        ticks:
        - “Shop UAE · Fatima” — 不再漏掉任何号码
        - 点击通知，直接打开对应聊天
        - 每个账号标签都显示未读数
      - media: video:chat
        h: 双向翻译，任何语言都能聊
        p: 消息翻译显示在原文下方。你用中文写，客户收到他们的语言。
        ticks:
        - 49 种语言
        - 发送前可检查译文
        - 客户看到的是正常消息
      - media: video:voice
        h: 语音消息 → 你的语言的文字
        p: 听不懂语音？点一下就能读。
        ticks:
        - 识别约 100 种口语
        - 离线处理 — 音频不离开你的电脑
      - media: video:photo
        h: 识别图片和文件中的文字
        p: 发票、订单、价目表、截图 — 一键识别并翻译。
        ticks:
        - 拉丁文、阿拉伯文、西里尔文、中文等
        - 客户不会收到任何提示
      extras:
      - ⚡ 快捷回复模板
      - 🛡 离线翻译，保护隐私
      - 🩹 卡住的账号自动重启
      - 🀄 中文 / 英文界面
    - type: cards
      id: who
      who: true
      k: 适用行业
      h: 专为客户说其他语言的企业打造
      p: 如果你用多个号码在 WhatsApp 上服务不同国家的客户，GlotChat 每天为你节省数小时。
      cta: 告诉我们你的行业，免费试用
