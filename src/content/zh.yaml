      - icon: 🏠
        h: 房产中介
        p: 外国买家发来语音和证件照片，立即看懂，任何经纪人号码上的客户都不会漏掉。
        pair: English ⇄ Русский · العربية
        link: for/real-estate
      - icon: 🩺
        h: 诊所和医疗旅游
        p: 每位顾问的号码都在一个窗口里。患者用他们的语言咨询，团队用他们的语言回复。
        pair: Türkçe ⇄ English · Deutsch
        link: for/clinics
      - icon: 🚢
        h: 外贸和批发商
        p: 用阿拉伯语、西班牙语、俄语或葡萄牙语给买家报价、谈判和跟进——你只需用中文输入。
        pair: 中文 ⇄ العربية · Español
        link: for/exporters
      - icon: ✈️
        h: 旅游和旅行社
        p: 来自世界各地游客的预订、改期和咨询——一台电脑全部搞定。
        pair: 中文 ⇄ English · Français
        link: for/travel
      - icon: 🛒
        h: 电商和分销商
        p: 每个店铺或国家一个号码，快捷回复模板，订单和收据照片一键翻译。
        pair: Português ⇄ Español · 中文
