        k: "Perguntas frequentes"
        h: "Respostas rápidas"
        items:
          - ["O WhatsApp Web traduz mensagens?", "O WhatsApp Web não tem tradução embutida. Você precisa copiar as mensagens para um tradutor, usar uma extensão ou um app de desktop com tradução embutida, como o GlotChat."]
          - ["Como traduzo um áudio do WhatsApp no computador?", "Primeiro transcreva para texto e depois traduza. O GlotChat faz as duas coisas com um clique, offline, para cerca de 100 idiomas falados."]
