      - - Por que o Windows diz “O Windows protegeu o computador”?
        - O Windows SmartScreen mostra esse aviso para apps novos que ainda não viu muitas vezes. Clique em <b>Mais informações</b> e depois em <b>Executar assim mesmo</b>. Baixe o GlotChat sempre desta página — você pode comparar o SHA-256 para ter certeza de que é o arquivo original.
      - - Por que a versão do instalador é mais antiga que a do GlotChat mais novo?
        - O instalador fica numa versão que o Windows já reconhece, para instalar sem problemas em qualquer PC. Um minuto depois de abrir o GlotChat, ele se atualiza sozinho para a versão mais nova (com Telegram e todas as novidades).
      - - Preciso de chave de licença?
        - 'Para o teste não: clique em <b>Iniciar meu teste grátis de 3 dias</b> no app e ele começa na hora. Quando comprar um plano, enviamos uma chave anual pelo Telegram — cole em <b>Já tenho uma chave de licença</b>.'
