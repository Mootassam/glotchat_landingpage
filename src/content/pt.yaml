pages:
  home:
    title: "GlotChat – Várias Contas de WhatsApp + Tradutor para PC"
    description: "Use várias contas de WhatsApp numa só janela no Windows e traduza conversas, áudios e fotos offline em 49 idiomas. Teste grátis de 3 dias."
    og_title: "GlotChat – Todas as suas contas de WhatsApp numa janela, cada cliente no idioma dele"
    og_heading: "Todas as suas contas de WhatsApp numa janela. Cada cliente no idioma dele."
    short: "Início"
    icon: "🏠"
    blocks:
    - type: hero_home
      eyebrow: Várias contas de WhatsApp + tradutor para Windows
      h1: Muitas contas de WhatsApp. <span class="grad">Uma janela. Qualquer idioma.</span>
      lead: Adicione todos os seus números, receba as notificações de cada conta e leia cada mensagem, áudio e foto no seu idioma.
      micro:
      - 3 dias grátis — sem pagar
      - Resposta rápida no Telegram
      - A partir de 69 USDT / ano
      media_alt: GlotChat traduzindo uma conversa de WhatsApp entre espanhol e inglês
      chapters:
      - id: accounts
        icon: 👥
        label: Adicionar contas
        cap: 'Adicione cada número de WhatsApp em segundos: dê um nome, escolha seu idioma e escaneie o QR code.'
      - id: notify
        icon: 🔔
        label: Notificações
        cap: Cada notificação mostra para qual conta chegou — clique e a conversa certa abre.
      - id: chat
        icon: 🌐
        label: Traduzir conversas
        cap: O cliente escreve no idioma dele e você lê no seu. Sua resposta vai no idioma dele.
      - id: voice
        icon: 🎤
        label: Áudios
        cap: Com um clique, o áudio vira texto traduzido para o seu idioma.
      - id: photo
        icon: 📷
        label: Fotos
        cap: 'Fotos de notas, pedidos e documentos: o texto é lido e traduzido.'
    - type: facts
      label: Números principais
      items:
      - - 27+
        - contas de WhatsApp ao mesmo tempo (testado)
      - - '49'
        - idiomas de tradução
      - - 100%
        - tradução offline no seu PC
      - - 🎤 + 🖼
        - tradução de áudios e fotos
    - type: showcase
      id: features
      k: Como funciona
      h: Veja o que o GlotChat faz em 5 vídeos curtos
      rows:
      - media: video:accounts
        h: Todos os seus números de WhatsApp em uma janela
        p: Adicione quantas contas precisar. Cada uma é separada, com login e idiomas próprios.
        ticks:
        - Escaneie o QR code uma vez e ela fica conectada
        - Testado com 27 contas ao mesmo tempo
        - WhatsApp e WhatsApp Business
      - media: video:notify
        h: Saiba para qual conta chegou cada mensagem
        p: A notificação mostra a conta e o cliente — já traduzida.
        ticks:
        - “Shop UAE · Fatima” — nenhum número esquecido
        - Clique na notificação e a conversa certa abre
        - Mensagens não lidas em cada aba
      - media: video:chat
        h: Converse em qualquer idioma, nos dois sentidos
        p: A tradução aparece abaixo da mensagem original. Você escreve no seu idioma e o cliente recebe no dele.
        ticks:
        - 49 idiomas
        - Confira a tradução antes de enviar
        - O cliente vê uma mensagem normal
      - media: video:voice
        h: Áudios → texto no seu idioma
        p: Não entendeu um áudio? Com um clique você lê.
        ticks:
        - Cerca de 100 idiomas falados
        - Funciona offline — o áudio fica no seu PC
      - media: video:photo
        h: Leia o texto de fotos e documentos
        p: Notas fiscais, pedidos, tabelas de preço, prints — lidos e traduzidos com um clique.
        ticks:
        - Alfabeto latino, árabe, cirílico, chinês e mais
        - O cliente não recebe nenhum aviso
      extras:
      - ⚡ Respostas rápidas
      - 🛡 Tradução offline e privada
      - 🩹 Contas travadas reiniciam sozinhas
      - 🀄 Interface em inglês e chinês
    - type: cards
      id: who
      who: true
      k: Para quem é
      h: Para empresas cujos clientes falam outro idioma
      p: Se você atende clientes de vários países pelo WhatsApp — em mais de um número — o GlotChat economiza horas todos os dias.
      cta: Conte sobre seu negócio — ganhe um teste grátis
      items:
      - icon: 🏠
        h: Imobiliárias
        p: Compradores estrangeiros mandam áudios e fotos de documentos. Entenda na hora e não perca nenhum cliente no número de nenhum corretor.
        pair: Português ⇄ English · Español
        link: for/real-estate
      - icon: 🩺
        h: Clínicas e turismo de saúde
        p: Uma janela para o número de cada coordenador. Os pacientes escrevem no idioma deles e sua equipe responde no idioma deles.
        pair: Português ⇄ English · Español
        link: for/clinics
      - icon: 🚢
        h: Exportadores e atacadistas
        p: Faça cotações, negocie e acompanhe compradores em inglês, espanhol, chinês ou árabe — escrevendo em português.
        pair: Português ⇄ 中文 · العربية
        link: for/exporters
      - icon: ✈️
        h: Viagens e turismo
        p: Reservas, mudanças e dúvidas de turistas do mundo todo — de um só PC.
        pair: Português ⇄ English · Español
        link: for/travel
      - icon: 🛒
        h: E-commerce e revendedores
        p: Um número por loja ou país, modelos de resposta rápida e fotos de pedidos e comprovantes traduzidas.
        pair: Português ⇄ Español · English
      - icon: 🎧
        h: Equipes de atendimento e vendas
        p: Seus atendentes trabalham no idioma deles; cada cliente recebe respostas no seu.
        pair: Português ⇄ English · Español
      soft: true
    - type: vs
      k: Por que o GlotChat
      h: Pare de copiar e colar em tradutores
      bad_h: Sem o GlotChat
      bad:
      - Um celular ou perfil de navegador para cada número
      - Copiar → colar → traduzir → colar de volta, em cada mensagem
      - Áudios que você não entende
      - Mensagens perdidas na “outra” conta
      - Conversas de clientes coladas em tradutores online
      good_h: Com o GlotChat
      good:
      - Todos os números numa janela, a um clique
      - A tradução aparece embaixo de cada mensagem automaticamente
      - Áudios viram texto no seu idioma
      - Cada notificação diz de qual conta é
      - Tudo traduzido offline, no seu próprio PC
    - type: steps
      k: Teste antes de pagar
      h: Grátis por 3 dias. Funcionando em 10 minutos.
      items:
      - - "Baixe o GlotChat"
        - "Baixe o instalador para Windows no nosso site e instale em cerca de um minuto — sem permissão de administrador."
      - - "Comece o teste grátis com um clique"
        - "Abra o GlotChat e clique em “Start my free 3-day trial”. Todos os recursos são liberados na hora — sem pagamento e sem precisar mandar mensagem."
      - - Gostou? Fique com ele.
        - Pague em USDT e receba sua chave anual. Suas contas e configurações continuam exatamente iguais — nada para configurar de novo.
      cta: "Baixar e começar meu teste grátis"
    - type: plans
      k: Preços
      h: Planos anuais simples. Teste grátis primeiro.
      p: Todos os planos incluem todos os recursos e atualizações. Comece com um teste grátis de 3 dias — pague só se gostar.
      more: Comparar planos em detalhe
      soft: false
    - type: faq
      k: Perguntas frequentes
      h: Suas dúvidas, respondidas
      items:
      - - Tem teste grátis?
        - "Sim. Baixe o GlotChat, abra e clique em “Start my free 3-day trial” — todos os recursos são liberados na hora, sem pagamento. Se gostar, você compra um plano e mantém todas as contas e configurações."
      - - É seguro para minhas contas de WhatsApp?
        - 'O GlotChat abre o WhatsApp Web oficial de cada conta, numa sessão isolada — igual a um navegador, só que organizado. Ele nunca envia mensagens sozinho: tudo é enviado por você. Como em qualquer uso do WhatsApp, evite spam e mensagens em massa não solicitadas.'
      - - A tradução precisa de internet?
        - Não. A tradução, a transcrição de áudio e a leitura de fotos rodam no seu PC. Você baixa um pacote de idioma uma vez (o inglês já vem incluído). O WhatsApp em si, claro, precisa de internet.
      - - Que computador eu preciso?
        - 'Windows 10 ou 11 (64 bits). Cada conta de WhatsApp usa cerca de 300–450 MB de memória: 8 GB de RAM dão para umas 10 contas; 16 GB ou mais para 20–30 contas.'
      - - Quais idiomas são suportados?
        - 49 idiomas de tradução, entre eles português, português do Brasil, inglês, espanhol, chinês, árabe, francês, alemão, italiano, russo, turco e japonês. Os áudios são reconhecidos em cerca de 100 idiomas.
      - - Funciona com o WhatsApp Business?
        - Sim. Dá para conectar contas do WhatsApp e do WhatsApp Business, do mesmo jeito que você conecta o WhatsApp Web.
      - - Como pago e recebo o programa?
        - Fale com a gente no Telegram, escolha seu plano e pague em USDT (TRC20, BEP20 ou ERC20). Você recebe o instalador e sua chave de licença, e ajudamos na instalação se precisar.
      - - Funciona no Mac ou no celular?
        - O GlotChat é um aplicativo para Windows. Seus celulares continuam funcionando normalmente — o GlotChat é um aparelho conectado, como o WhatsApp Web.
    - type: related
      k: Saiba mais
      h: Guias e comparações
      items:
      - guides/multiple-whatsapp-accounts-on-pc
      - guides/translate-whatsapp-messages-on-pc
      - compare

