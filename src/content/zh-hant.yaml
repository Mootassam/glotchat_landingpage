      - - 用多開軟體會被封號嗎？
        - 基於官方 WhatsApp 網頁版的多開軟體，和在瀏覽器裡使用 WhatsApp 一樣。封號通常來自行為：群發騷擾、垃圾訊息、使用修改版 WhatsApp。正常聊天就沒問題。
