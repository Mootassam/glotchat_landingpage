          | 通知 | 標明帳號，點選直達 | ✓ |
          | 翻譯 | 雙向、語言多、離線 | ✓ 49 種語言，離線翻譯 |
          | 語音 / 圖片 | 語音轉文字、圖片識字 | ✓ 都能翻譯 |
          | 電腦配置 | 分批啟動、休眠、自動恢復 | ✓ 實測 27 個帳號同時執行 |
          | 中文 | 簡體中文介面 | ✓ |
