        lead: "很多外貿人從一個瀏覽器翻譯外掛開始。號碼一多、平台一多，問題就來了。這篇講清楚兩者的區別，以及什麼時候該換。"
        no_cta: true
      - type: prose
        toc: true
        md: |
          做外貿，客戶來自世界各地。最常見的起步方式是在 Chrome 裡給 WhatsApp Web 裝一個翻譯外掛。一個號碼、一種語言時，這很好用。但當你有 3 個以上號碼，還要回 Telegram、Instagram 和 Facebook 的客戶時，外掛就不夠了。

          > **簡短回答：** 一個號碼、偶爾翻譯 —— 用外掛就夠。多個號碼、多個平台、客戶天天發語音 —— 選自帶翻譯的聚合聊天軟體，比如 GlotChat。

          ## 翻譯外掛能做什麼

          WhatsApp 翻譯外掛裝在瀏覽器裡，在 WhatsApp Web 頁面上翻譯訊息。好的外掛可以自動翻譯收到的訊息，也能翻譯你要發出的回覆。

          - **優點：** 安裝快，很多有免費額度。
          - **缺點：** 一個瀏覽器只能登入一個 WhatsApp；多數只支援 WhatsApp Web；訊息通常發到雲端翻譯；語音訊息一般不能翻譯。

          ## 聚合聊天軟體能做什麼

          聚合聊天軟體是電腦上的獨立軟體，把多個平台、多個帳號放進一個視窗。GlotChat 這樣的軟體還**自帶翻譯**：

          - WhatsApp、Telegram、Messenger、Instagram、Discord 和 BAND 在同一個視窗，**每個應用都能多開**。
          - 每個聊天**雙向翻譯**，49 種語言，傳送前先顯示客戶將讀到的內容。
          - WhatsApp 和 Telegram 的**語音轉文字並翻譯**，圖片裡的文字也能翻譯。
          - 翻譯在電腦上**離線**完成，聊天內容不發到雲端。

          ## 對比表

          | | 翻譯外掛 | GlotChat |
          |---|---|---|
          | 多個 WhatsApp 號碼 | 一個瀏覽器一個 | 一個視窗多開 |
          | Telegram、Instagram、Facebook | 一般不支援 | 支援 |
          | 收到的訊息自動翻譯 | 支援 | 支援 |
          | 回覆傳送前翻譯 | 部分支援 | 支援，並顯示客戶將讀到的內容 |
          | 語音訊息翻譯 | 一般不支援 | 支援（WhatsApp、Telegram） |
          | 圖片文字翻譯 | 一般不支援 | 支援 |
          | 訊息去哪裡翻譯 | 通常是雲端 | 你的電腦上（離線） |
          | 價格 | 免費額度 / 按月付費 | 免費 3 天，69 USDT/年起 |

          ## 什麼時候該從外掛換到聚合聊天軟體

          1. **號碼超過 2 個。** 開多個瀏覽器、來回切換，很容易漏回訊息。
          2. **客戶分散在多個平台。** WhatsApp、Telegram、Instagram 的客戶都要回。
          3. **客戶常發語音。** 中東、拉美、非洲的客戶特別愛發語音，外掛聽不懂。
          4. **在意隱私。** 客戶資料和報價不想發到第三方雲端。
          5. **團隊一起用。** 每個業務員的帳號清楚命名、分開通知。

          ## 會不會封號？

          WhatsApp Web 連結裝置是官方功能，外掛和 GlotChat 都用它。真正導致封號的是**行為**：群發、騷擾陌生人、使用修改版 WhatsApp（比如「GB WhatsApp」）。正常聊天就沒問題。

          想在自己的號碼上試試？[免費試用 GlotChat 3 天](/zh-hant/download/) —— 全部功能，不用付款。
