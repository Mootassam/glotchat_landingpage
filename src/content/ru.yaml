        k: "Вопросы"
        h: "Вопросы о безопасности"
        items:
          - ["GlotChat безопасен?", "Да. GlotChat показывает официальные веб-версии приложений в изолированных сессиях, ничего не отправляет сам и хранит чаты на вашем ПК."]
