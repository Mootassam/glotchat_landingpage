          > **Коротко:** попробуйте GlotChat бесплатно 3 дня → напишите нам в Telegram тариф и Machine ID → отправьте USDT на адрес, который мы пришлём → вставьте полученный ключ. Готово.

          ## 1. Сначала попробуйте бесплатно

          [Скачайте GlotChat](/ru/download/) и включите бесплатный 3-дневный пробный период в один клик. Все функции открыты, без оплаты. Добавьте свои аккаунты и убедитесь, что GlotChat вам подходит, прежде чем платить.

          ## 2. Выберите тариф

          Аккаунты считаются **по приложениям**: Starter — это 5 WhatsApp + 5 Telegram + 5 Instagram и так далее.

          | Тариф | Аккаунтов на приложение | Компьютеров | Цена за год |
          |---|---|---|---|
          | Starter | до 5 | 1 | 69 USDT |
          | Pro | до 15 | 1 | 129 USDT |
          | Business | без ограничений | до 3 | 249 USDT |

          ## 3. Скопируйте Machine ID

          В GlotChat откройте **Настройки → Лицензия** и нажмите **Копировать** рядом с Machine ID. Ключ делается для этого компьютера.

          ## 4. Напишите нам в Telegram

          Напишите **[@GlotChat](https://t.me/GlotChat)** тариф и Machine ID. Мы ответим точной суммой и адресом USDT — **доверяйте только адресу, полученному от @GlotChat**.

          ## 5. Купите USDT (если его нет)

          USDT — это цифровой доллар: 1 USDT ≈ 1 доллар США. Самые простые способы:

          - **Binance или OKX:** зарегистрируйтесь и купите USDT картой, банковским переводом или через **P2P** (платите местному продавцу в своей валюте).
          - **Bybit, KuCoin, Bitget** и большинство бирж работают так же.
          - **Друг или коллега** с USDT может заплатить за вас — это нормально.

          ## 6. Отправьте USDT в правильной сети

          USDT есть в нескольких сетях. Мы принимаем **TRC20 (Tron), BEP20 (BNB Smart Chain) и ERC20 (Ethereum)**. Сеть при отправке **должна совпадать** с адресом, который мы дали.

          1. На бирже откройте **Вывод → USDT**.
          2. Вставьте наш адрес и выберите **ту же сеть**, что мы указали (у TRC20 и BEP20 обычно самые низкие комиссии; ERC20 может быть дорогой).
          3. Проверьте, что **к нам придёт** полная цена тарифа — комиссия биржи сверху.
          4. Подтвердите. Затем пришлите в Telegram скриншот или ID транзакции (TXID).

          ## 7. Вставьте ключ

          Годовой ключ обычно приходит за несколько минут. В GlotChat откройте **Настройки → Ввести новый ключ** и вставьте его. Аккаунты, входы и настройки остаются такими же, как в пробном периоде.

          ## Советы по безопасности

          - Отправляйте только на адрес, полученный от **@GlotChat** в Telegram. Мы никогда не просим пароль от биржи, сид-фразу или коды.
          - Внимательно проверьте **сеть**. USDT, отправленный не в той сети, можно потерять.
          - Сохраните **TXID**, пока ключ не заработает.

          Вопросы перед оплатой? [Спросите живого человека в Telegram](https://t.me/GlotChat) — проведём по всем шагам.
