    blocks:
      - type: hero
        k: "Безопасность"
        h1: "GlotChat безопасен? <span class=\"grad\">Заблокируют ли аккаунт?</span>"
        lead: "Честный ответ простыми словами: что делает GlotChat, чего он никогда не делает и за что на самом деле блокируют аккаунты."
      - type: cards
