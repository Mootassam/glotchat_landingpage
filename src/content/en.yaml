pages:
  # ================================================================ HOME
  home:
    title: "GlotChat – Multiple WhatsApp Accounts + Translator for PC"
    description: "Run many WhatsApp accounts in one window on Windows and translate chats, voice notes and photos offline in 49 languages. Free 3-day trial."
    og_title: "GlotChat – All your WhatsApp accounts in one window, every customer in their language"
    og_heading: "All your WhatsApp accounts in one window. Every customer in their language."
    short: "Home"
    icon: "🏠"
    blocks:
    - type: hero_home
      eyebrow: WhatsApp multi-account + translator for Windows
      h1: Many WhatsApp accounts. <span class="grad">One window. Any language.</span>
      lead: Add all your numbers, get each account's notifications, and read every message, voice note and photo in your own language.
      micro:
      - 3 days free — no payment
      - Fast reply on Telegram
      - From 69 USDT / year
      media_alt: GlotChat translating a WhatsApp chat between Spanish and English
      chapters:
      - id: accounts
        icon: 👥
        label: Add accounts
        cap: 'Add each WhatsApp number in seconds: name it, pick your language, scan the QR code.'
      - id: notify
        icon: 🔔
        label: Notifications
        cap: Every notification shows which account it's for — click it and the right chat opens.
      - id: chat
        icon: 🌐
        label: Translate chats
        cap: Customers write in their language, you read yours. Your reply is sent in theirs.
      - id: voice
        icon: 🎤
        label: Voice notes
        cap: One click turns a voice note into text — translated into your language.
      - id: photo
        icon: 📷
        label: Photos
        cap: 'Photos of invoices, orders and documents: the text is read and translated.'
    - type: facts
      label: Key facts
      items:
      - - 27+
        - WhatsApp accounts at once (tested)
      - - '49'
        - translation languages
      - - 100%
        - offline translation on your PC
      - - 🎤 + 🖼
        - voice & photo translation
    - type: showcase
      id: features
      k: How it works
      h: See what GlotChat does — in 5 short clips
      rows:
      - media: video:accounts
        h: All your WhatsApp numbers in one window
        p: Add as many accounts as you need. Each one is separate, with its own login and its own languages.
        ticks:
        - Scan the QR code once — it stays logged in
        - Tested with 27 accounts at the same time
        - WhatsApp and WhatsApp Business
      - media: video:notify
        h: Know which account every message is for
        p: Notifications show the account and the customer — already translated.
        ticks:
        - “Shop UAE · Fatima” — never miss a number
        - Click the notification, the right chat opens
        - Unread counts on every account tab
      - media: video:chat
        h: Chat in any language, both ways
        p: Messages are translated under the original. You write in your language — the customer gets theirs.
        ticks:
        - 49 languages
        - Check the translation before it's sent
        - The customer sees a normal message
      - media: video:voice
        h: Voice notes → text in your language
        p: Can't understand a voice message? One click and you read it.
        ticks:
        - About 100 spoken languages
        - Works offline — the audio stays on your PC
      - media: video:photo
        h: Read the text in photos and documents
        p: Invoices, orders, price lists, screenshots — read and translated in one click.
        ticks:
        - Latin, Arabic, Cyrillic, Chinese and more
        - The customer isn't notified
      extras:
      - ⚡ Quick-reply templates
      - 🛡 Offline & private translation
      - 🩹 Frozen accounts restart by themselves
      - 🀄 English & 中文 interface
    - type: cards
      id: who
      who: true
      k: Who it's for
      h: Made for businesses whose customers speak another language
      p: If you answer WhatsApp customers from different countries — on more than one number — GlotChat saves you hours every day.
      cta: Tell us your business — get a free trial
      items:
      - icon: 🏠
        h: Real estate agencies
        p: Foreign buyers send voice notes and photos of documents. Understand them instantly and never miss a lead on any agent's number.
        pair: English ⇄ Русский · العربية
        link: for/real-estate
      - icon: 🩺
        h: Clinics & medical tourism
        p: One window for every coordinator's number. Patients write in their language, your team answers in theirs.
        pair: Türkçe ⇄ English · Deutsch
        link: for/clinics
      - icon: 🚢
        h: Exporters & wholesalers
        p: Quote, negotiate and follow up with buyers in Arabic, Spanish, Russian or Portuguese — while you write in your own language.
        pair: 中文 ⇄ العربية · Español
        link: for/exporters
      - icon: ✈️
        h: Travel & tourism
        p: Bookings, changes and questions from tourists all over the world — handled from one PC.
        pair: English ⇄ Français · Italiano
        link: for/travel
      - icon: 🛒
        h: E-commerce & resellers
        p: Separate numbers for each shop or country, quick-reply templates, and translated photos of orders and receipts.
        pair: Português ⇄ Español · English
      - icon: 🎧
        h: Support & sales teams
        p: Your agents work in their own language; every customer gets answers in theirs.
        pair: 中文 ⇄ English · Tiếng Việt
      soft: true
    - type: vs
      k: Why GlotChat
      h: Stop copy-pasting into translators
      bad_h: Without GlotChat
      bad:
      - A phone or browser profile for every number
      - Copy → paste → translate → paste back, for every message
      - Voice notes you can't understand
      - Missed messages on the “other” account
      - Customer chats pasted into online translators
      good_h: With GlotChat
      good:
      - All numbers in one window, one click apart
      - Translation appears under every message automatically
      - Voice notes turned into text, in your language
      - Every notification tells you which account it's for
      - Everything translated offline, on your own PC
    - type: steps
      k: Try before you pay
      h: Free for 3 days. Up and running in 10 minutes.
      items:
      - - Message us on Telegram
        - Tell us how many WhatsApp accounts you use. We send you the installer and answer every question.
      - - Get your free trial key
        - Install GlotChat, send us the Machine ID it shows, and receive a 3-day key with every feature unlocked.
      - - Love it? Keep it.
        - Pay in USDT and get your yearly key. Your accounts and settings stay exactly as they are — nothing to set up again.
      cta: Get my free trial on Telegram
    - type: plans
      k: Pricing
      h: Simple yearly plans. Try free first.
      p: Every plan includes all features and all updates. Start with a free 3-day trial — pay only if you love it.
      more: Compare plans in detail
      soft: false
    - type: faq
      k: FAQ
      h: Questions, answered
      items:
      - - Is there a free trial?
        - Yes. Message us on Telegram and you get a 3-day trial key with every feature unlocked — no payment needed. If you like it, you buy a plan and keep all your accounts and settings.
      - - Is it safe for my WhatsApp accounts?
        - 'GlotChat opens the official WhatsApp Web for each account, in its own isolated session — exactly like a browser, just organised. It never sends messages by itself: everything is sent by you. As with any WhatsApp use, avoid spam and bulk unsolicited messages.'
      - - Does translation need the internet?
        - No. Translation, voice transcription and photo reading run on your own PC. You download a language pack once (English is built in). WhatsApp itself of course needs the internet.
      - - Which computer do I need?
        - 'Windows 10 or 11 (64-bit). Each WhatsApp account uses about 300–450 MB of memory: 8 GB RAM is fine for about 10 accounts, 16 GB or more for 20–30 accounts.'
      - - Which languages are supported?
        - 49 translation languages, including English, Chinese, Spanish, Arabic, French, German, Portuguese, Russian, Turkish, Hindi, Japanese, Korean and Vietnamese. Voice messages are recognised in about 100 languages.
      - - Does it work with WhatsApp Business?
        - Yes. Both WhatsApp and WhatsApp Business accounts can be linked, the same way you link WhatsApp Web.
      - - How do I pay and receive the software?
        - Message us on Telegram, choose your plan and pay in USDT (TRC20, BEP20 or ERC20). You receive the installer and your license key, and we help you set it up if needed.
      - - Does it work on Mac or phone?
        - GlotChat is a Windows desktop app. Your phones keep working normally — GlotChat is a linked device, like WhatsApp Web.
    - type: related
      k: Learn more
      h: Guides and comparisons
      items:
      - guides/multiple-whatsapp-accounts-on-pc
      - guides/translate-whatsapp-messages-on-pc
      - compare

