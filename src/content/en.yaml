        k: "FAQ"
        h: "Quick answers"
        items:
          - ["Can WhatsApp Web translate messages?", "WhatsApp Web has no built-in translation for chats. You need to copy messages into a translator, use an extension, or use a desktop app with translation built in, like GlotChat."]
          - ["How do I translate a WhatsApp voice message on my computer?", "Transcribe it to text first, then translate it. GlotChat does both with one click, offline, for about 100 spoken languages."]
