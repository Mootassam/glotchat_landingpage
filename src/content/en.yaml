pages:
  # ================================================================ HOME
  home:
    title: "WhatsApp & Telegram Multi-Account Translator for PC | GlotChat"
    description: "All your WhatsApp and Telegram accounts in one window on Windows. Chats, voice notes and photos translated offline in 49 languages. Free 3-day trial."
    keywords: "whatsapp translator pc, telegram translator pc, multiple whatsapp accounts, multiple telegram accounts, whatsapp multi account, translate whatsapp messages"
    og_title: "GlotChat – All your WhatsApp & Telegram accounts in one window, every customer in their language"
    og_heading: "WhatsApp & Telegram in one window. Every customer in their language."
    short: "Home"
    icon: "🏠"
    blocks:
    - type: hero_home
      eyebrow: "New in 1.3 — Telegram + translation you can check"
      h1: "All your WhatsApp & Telegram. <span class=\"grad\">One window. Every language.</span>"
      lead: "Run every number and every Telegram login side by side on your PC. Read each message, voice note and photo in your language — and reply in your customer's, knowing exactly what they'll read."
      micro:
      - 3 days free — no card, no payment
      - Real person replies on Telegram
      - From 69 USDT / year
      media_alt: GlotChat translating a WhatsApp chat between Spanish and English
      floats:
      - ["↩", "They will read: “Yes, size L is in stock”", "Every reply checked before it's sent"]
      - ["🔢", "$45 · 15/11 · +971 50…", "Prices & numbers never change"]
      - ["🎤", "Transcribing… 64%", "Long voice notes, live progress"]
      - ["🛡", "100% on your PC", "No cloud translator sees your chats"]
      chapters:
      - id: accounts
        icon: 👥
        label: Add accounts
        cap: 'Add each WhatsApp number or Telegram login in seconds: name it, pick your language, scan the QR code.'
      - id: telegram
        icon: ✈️
        label: Telegram
        cap: Telegram works the same way — every chat translated, every reply sent in the customer's language.
      - id: chat
        icon: 🌐
        label: Translate chats
        cap: Customers write in their language, you read yours. Before you send, you see what they'll read.
      - id: notify
        icon: 🔔
        label: Notifications
        cap: Every notification shows which account it's for — already translated. Click it and the right chat opens.
      - id: voice
        icon: 🎤
        label: Voice notes
        cap: One click turns a voice note into text, translated into your language — with live progress for long ones.
      - id: photo
        icon: 📷
        label: Photos
        cap: 'Photos of invoices, orders and documents: the text is read and translated.'
    - type: facts
      label: Key facts
      items:
      - - '2 + 3'
        - WhatsApp & Telegram, + 3 apps in beta
      - - 27+
        - accounts at once (tested)
      - - '49'
        - translation languages, offline
      - - '0'
        - messages sent to a cloud translator
    - type: apps
      id: apps
      k: One app for every chat
      h: Your customers are on WhatsApp <em>and</em> Telegram. Now you are too — in one place.
      p: Each account runs in its own sealed space, with its own login, notifications and (if you want) its own proxy.
      items:
      - {icon: wa, cls: wa, name: "WhatsApp & WhatsApp Business", p: "Every number your business uses — scan the QR code once and it stays connected. Chats, voice notes and photos translated.", link: "whatsapp-translator", more: "WhatsApp translator"}
      - {icon: tg, cls: tgc, name: "Telegram", p: "Every Telegram login side by side — personal, shop, support. Log in with a QR code or your phone number. Chats translated both ways.", link: "telegram-translator", more: "Telegram translator"}
      - {icon: ms, cls: beta, beta: true, name: "Messenger", p: "Facebook Messenger inbox with translation under the messages and a Translate button for your replies."}
      - {icon: ig, cls: beta, beta: true, name: "Instagram Direct", p: "Instagram DMs from customers translated under each message; your reply translated before you send it."}
      - {icon: dc, cls: beta, beta: true, name: "Discord", p: "Servers and DMs with translation of each message and of what you write."}
      note: "Beta apps are included in every plan. They translate text messages; voice notes and photos are translated on WhatsApp and Telegram."
    - type: showcase
      id: features
      k: How it works
      h: See GlotChat at work — in short clips
      rows:
      - media: video:accounts
        h: Every number and every login in one window
        p: Add as many WhatsApp and Telegram accounts as you need. Each one is separate, with its own login, colour, languages and notifications.
        ticks:
        - Scan the QR code once — it stays logged in
        - Tested with 27 accounts at the same time
        - Optional proxy per account, checked every minute
      - media: video:telegram
        tag: New in 1.3
        h: Telegram, translated like WhatsApp
        p: Open a Telegram chat and every message is already in your language. Write your reply in yours — the customer gets theirs.
        ticks:
        - Log in with a QR code or your phone number
        - Translation under every message, both directions
        - Quick-reply templates work in Telegram too
        link: ["telegram-translator", "More about the Telegram translator"]
      - media: video:chat
        h: Know what the customer will read — before you send
        p: Write in your language and press Enter. GlotChat shows the translation, and the same text translated back into your language, so you can be sure it says what you mean.
        ticks:
        - “They will read” check under every translation
        - Prices, dates and phone numbers are checked
        - “Other wording” gives you a few ways to say it
      - media: video:voice
        h: Voice notes → text in your language
        p: Can't understand a voice message? One click and you read it — even a 5-minute one, with the progress and the text appearing as it goes.
        ticks:
        - About 100 spoken languages
        - Works offline — the audio stays on your PC
        - Copy the transcript or the translation in one click
      - media: video:photo
        h: Read the text in photos and documents
        p: Invoices, orders, price lists, screenshots — read and translated in one click.
        ticks:
        - Latin, Arabic, Cyrillic, Chinese and more
        - The customer isn't notified
      extras:
      - ⚡ Quick-reply templates
      - 🔔 Notifications name the account
      - 🛡 Offline & private translation
      - 🩹 Frozen accounts restart by themselves
      - 🀄 English & 中文 interface
    - type: trust
      id: trust
      k: Translation you can trust
      h: A wrong price can lose a customer. GlotChat checks every translation.
      p: Machine translation is fast but not perfect. So GlotChat cleans up chat-style writing before it translates, and checks the result before anything is sent.
      items:
      - h: "See exactly what the customer will read"
        p: "Under every translation, GlotChat shows the same text translated back into your language. If the meaning changed, you see it before the customer does — and you can edit or pick another wording."
        wide: true
        mock:
          top: "<span>Send in <b>Arabic</b></span><span>from English</span>"
          input: "Can you send 3 boxes by Friday? Total $45"
          main: "هل يمكنك إرسال 3 صناديق بحلول يوم الجمعة؟ المجموع 45 دولارًا"
          rtl: true
          notes: [["back", "↩ They will read: Can you send 3 boxes by Friday? Total $45"]]
      - h: "Prices and numbers never change"
        p: "Prices, quantities, dates, times, order numbers, phone numbers and links are checked in every translation. A changed number is put back; a missing one is flagged."
        mock:
          input: "Order #4521: 1,250.50 EUR. Call +33 6 12 34 56 78 at 3:30pm."
          arrow: true
          main: "Commande n° 4521 : 1 250,50 EUR. Appelez le +33 6 12 34 56 78 à 3:30pm."
          notes: [["ok", "✓ 4521 · 1,250.50 · +33 6 12 34 56 78 · 3:30pm — all kept"]]
      - h: "It understands how people really chat"
        p: "“how r u pls send ur address thx”, ALL CAPS, “hiiiii”, Arabic dialect — GlotChat turns real chat writing into clean sentences the translator understands."
        mock:
          input: "how r u? pls send ur address thx"
          arrow: true
          main: "كيف حالك؟ أرجوك أرسل عنوانك، شكراً"
          rtl: true
          notes: [["info", "Arabic dialect too: “مرحبااااا كيفك” → “Hi. How are you?”"]]
      - h: "Not quite right? Pick another wording"
        p: "One click on “Other wording” shows a few ways to say the same thing — each with what the customer will read."
        mock:
          top: "<span>🔁 <b>Other wording</b></span><span>French</span>"
          chips: ["Pouvez-vous m'envoyer la liste des prix aujourd'hui ?", "Tu peux m'envoyer la liste des prix aujourd'hui ?", "Pouvez-vous m'envoyer la liste de prix aujourd'hui ?"]
      - h: "Your brand names stay yours"
        p: "Add your shop, brand and product names to the “Never translate” list once. They're never changed — in any chat, in any language."
        mock:
          input: "Order on GlotShop with code SAVE20"
          arrow: true
          main: "Commandez sur GlotShop avec le code SAVE20"
          notes: [["ok", "✓ “GlotShop” is on your never-translate list"]]
      cta: "Try the translation free for 3 days"
    - type: cards
      id: who
      who: true
      k: Who it's for
      h: Made for businesses whose customers speak another language
      p: If you answer customers from different countries — on more than one number or app — GlotChat saves you hours every day.
      cta: Tell us your business — we'll show you how it fits
      items:
      - icon: 🏠
        h: Real estate agencies
        p: Foreign buyers send voice notes and photos of documents. Understand them instantly and never miss a lead on any agent's number.
        pair: English ⇄ Русский · العربية
        link: for/real-estate
      - icon: 🩺
        h: Clinics & medical tourism
        p: One window for every coordinator's number. Patients write in their language, your team answers in theirs.
        pair: Türkçe ⇄ English · Deutsch
        link: for/clinics
      - icon: 🚢
        h: Exporters & wholesalers
        p: Quote, negotiate and follow up with buyers on WhatsApp and Telegram in Arabic, Spanish, Russian or Portuguese — while you write in your own language.
        pair: 中文 ⇄ العربية · Español
        link: for/exporters
      - icon: ✈️
        h: Travel & tourism
        p: Bookings, changes and questions from tourists all over the world — handled from one PC.
        pair: English ⇄ Français · Italiano
        link: for/travel
      - icon: 🛒
        h: E-commerce & resellers
        p: Separate numbers for each shop or country, quick-reply templates, and translated photos of orders and receipts.
        pair: Português ⇄ Español · English
      - icon: 🎧
        h: Support & sales teams
        p: Your agents work in their own language; every customer gets answers in theirs — on WhatsApp and Telegram.
        pair: 中文 ⇄ English · Tiếng Việt
      soft: true
    - type: vs
      k: Why GlotChat
      h: Stop copy-pasting into translators
      bad_h: Without GlotChat
      bad:
      - A phone, a browser profile or an app for every account
      - Copy → paste → translate → paste back, for every message
      - Hoping the translation says what you meant
      - Voice notes you can't understand
      - Customer chats pasted into online translators
      good_h: With GlotChat
      good:
      - WhatsApp and Telegram accounts in one window, one click apart
      - Translation appears under every message automatically
      - You see what the customer will read before you send
      - Voice notes turned into text, in your language
      - Everything translated offline, on your own PC
    - type: steps
      k: Try before you pay
      h: Free for 3 days. Up and running in 10 minutes.
      items:
      - - "Download GlotChat"
        - "Get the Windows installer from our website and install it in about a minute — no admin rights needed."
      - - "Start your free trial in one click"
        - "Open GlotChat and click “Start my free 3-day trial”. Every feature is unlocked at once — no payment, no message needed."
      - - Love it? Keep it.
        - Pay in USDT and get your yearly key. Your accounts and settings stay exactly as they are — nothing to set up again.
      cta: "Download & start my free trial"
    - type: plans
      k: Pricing
      h: Simple yearly plans. Try free first.
      p: Every plan includes all features, all apps and all updates. Start with a free 3-day trial — pay only if you love it.
      more: Compare plans in detail
      soft: false
    - type: faq
      k: FAQ
      h: Questions, answered
      items:
      - - Is there a free trial?
        - "Yes. Download GlotChat, open it and click “Start my free 3-day trial” — every feature is unlocked at once, no payment needed. If you like it, you buy a plan and keep all your accounts and settings."
      - - Does it work with Telegram?
        - "Yes. Since version 1.3 you can add Telegram accounts next to your WhatsApp numbers. Each one logs in with a QR code or phone number, and chats are translated both ways, just like WhatsApp."
      - - Is it safe for my accounts?
        - 'GlotChat opens the official WhatsApp Web and Telegram Web for each account, in its own isolated session — exactly like a browser, just organised. It never sends messages by itself: everything is sent by you. As with any messenger, avoid spam and bulk unsolicited messages.'
      - - How good is the translation?
        - "Very good for everyday business chat — prices, orders, appointments, questions. And you never have to guess: before you send, GlotChat shows what the customer will read, checks every number, and offers other wordings. For contracts or medical wording, have important texts checked by a person."
      - - Does translation need the internet?
        - No. Translation, voice transcription and photo reading run on your own PC. You download a language pack once (English is built in). WhatsApp and Telegram themselves of course need the internet.
      - - Which computer do I need?
        - 'Windows 10 or 11 (64-bit). Each account uses about 300–450 MB of memory: 8 GB RAM is fine for about 10 accounts, 16 GB or more for 20–30.'
      - - How do I pay and receive the software?
        - Download the free trial from this website. When you're ready, message us on Telegram, choose your plan and pay in USDT (TRC20, BEP20 or ERC20). Your license key arrives within minutes, and we help you set up if needed.
      - - Does it work on Mac or phone?
        - GlotChat is a Windows desktop app. Your phones keep working normally — GlotChat is a linked device, like WhatsApp Web or Telegram Desktop.
    - type: related
      k: Learn more
      h: Guides and comparisons
      items:
      - telegram-translator
      - guides/multiple-telegram-accounts-on-pc
      - compare

