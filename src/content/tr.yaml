      - h: Müşterinin ne okuyacağını tam olarak görün
        p: GlotChat her çevirinin altında aynı metni Türkçeye geri çevrilmiş olarak gösterir. Anlam değiştiyse müşteriden önce siz görürsünüz — düzenleyebilir ya da başka bir ifade seçebilirsiniz.
        wide: true
        mock:
          top: <span><b>Arapça</b> gönder</span><span>Türkçeden</span>
          input: Cumaya kadar 3 koli gönderebilir misiniz? Toplam 45 $
          main: هل يمكنك إرسال 3 صناديق بحلول يوم الجمعة؟ المجموع 45 دولارًا
          rtl: true
          notes:
          - - back
            - '↩ Okuyacağı: Cumaya kadar 3 koli gönderebilir misiniz? Toplam 45 $'
      - h: Fiyatlar ve rakamlar asla değişmez
        p: Fiyatlar, miktarlar, tarihler, saatler, sipariş ve telefon numaraları ile bağlantılar her çeviride kontrol edilir. Değişen rakam geri konur; eksik olan işaretlenir.
        mock:
          input: 'Sipariş #4521: 1.250,50 EUR. +33 6 12 34 56 78''i 15:30''da arayın.'
          arrow: true
          main: 'Commande n° 4521 : 1 250,50 EUR. Appelez le +33 6 12 34 56 78 à 15:30.'
          notes:
          - - ok
            - ✓ 4521 · 1.250,50 · +33 6 12 34 56 78 · 15:30 — hepsi korundu
      - h: İnsanların gerçekten nasıl yazdığını anlar
        p: “how r u pls send ur address thx”, BÜYÜK HARF, “merhabaaaa”, Arapça lehçe — GlotChat gerçek sohbet yazısını çevirmenin anlayacağı düzgün cümlelere çevirir.
        mock:
          input: how r u? pls send ur address thx
          arrow: true
          main: Nasılsın? Lütfen adresini gönder, teşekkürler
          notes:
          - - info
            - 'Arapça lehçe de: “مرحبااااا كيفك” → “Merhaba, nasılsın?”'
      - h: Tam olmadı mı? Başka bir ifade seçin
        p: “Başka ifade”ye tek tıkla aynı şeyi söylemenin birkaç yolunu görün — her biri müşterinin okuyacağıyla birlikte.
