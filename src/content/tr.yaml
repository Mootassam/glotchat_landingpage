        - Evet. Hesabın ayarlarını açıp proxy'yi yapıştırın (http:// veya socks5://, gerekirse kullanıcı adı ve şifreyle). GlotChat onu kontrol eder ve çalışmayı bırakırsa uyarır.
      - - Hesaplarım banlanır mı?
        - GlotChat resmi WhatsApp Web'i kullanır; bu, WhatsApp'ı tarayıcıda kullanmakla aynıdır. Banlar WhatsApp'ın yasakladığı davranışlardan gelir — spam, toplu istenmeyen mesaj, modifiye uygulamalar. Hesaplarınızı normal kullanırsanız sorun olmaz.
      - - WhatsApp Business ile çalışır mı?
        - Evet — WhatsApp ve WhatsApp Business hesaplarının ikisi de bağlanabilir.
