      h: Yanlış bir fiyat müşteri kaybettirir. GlotChat her çeviriyi kontrol eder.
      p: Makine çevirisi hızlıdır ama kusursuz değildir. Bu yüzden GlotChat sohbet tarzı yazıyı çevirmeden önce düzenler ve bir şey gönderilmeden önce sonucu kontrol eder.
