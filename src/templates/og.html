<!doctype html><html lang="{{lang}}" dir="ltr"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{overflow:hidden}
body{margin:0;width:1200px;height:630px;overflow:hidden;font-family:"Segoe UI","Microsoft YaHei","Segoe UI Arabic",sans-serif;color:#fff;
background:radial-gradient(800px 500px at 90% -10%,rgba(16,196,140,.38),transparent 60%),radial-gradient(700px 420px at 0% 100%,rgba(124,92,255,.32),transparent 60%),#0b1220}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:44px 44px}
.l{position:absolute;left:64px;top:52px;width:620px}
.rtl .l{left:auto;right:64px;text-align:right}.rtl .b,.rtl .chips{flex-direction:row-reverse;justify-content:flex-start}
.b{display:flex;align-items:center;gap:14px;font-weight:800;font-size:30px}.b img{width:56px;height:56px;border-radius:14px}
.k{display:inline-block;margin-top:34px;padding:7px 16px;border-radius:99px;background:rgba(16,196,140,.16);border:1px solid rgba(52,227,166,.45);color:#7ef0c6;font-weight:700;font-size:20px}
h1{font-size:46px;line-height:1.12;margin:18px 0 14px;letter-spacing:-1px;font-weight:800;
display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rtl h1,[lang=zh] h1{letter-spacing:0;line-height:1.3}
p{font-size:22px;color:#c5cfdc;margin:0;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;gap:10px;margin-top:22px;flex-wrap:nowrap}.chips span{padding:8px 14px;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);font-size:18px;font-weight:600}
.shot{position:absolute;right:-110px;top:120px;width:560px;border-radius:16px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.15);transform:rotate(-3deg)}
.rtl .shot{right:auto;left:-110px;transform:rotate(3deg)}
.tg{position:absolute;left:64px;bottom:44px;font-size:21px;color:#9fd8f5;font-weight:700}
.rtl .tg{left:auto;right:64px}
</style></head><body class="{{dir}}"><div class="grid"></div>
<div class="l" dir="{{dir}}"><div class="b"><img src="file:///{{root}}/assets/img/icon-192.png">GlotChat</div>
<span class="k">{{kicker}}</span>
<h1>{{title}}</h1>
<p>{{sub}}</p>
<div class="chips">{{chips}}</div></div>
<img class="shot" src="file:///{{root}}/assets/media/chat-{{lang}}-land.webp" onerror="this.src='file:///{{root}}/assets/media/chat-en-land.webp'">
<div class="tg">glotchat.com · Telegram @GlotChat</div>
</body></html>
