      floats:
      - ["↩", "سيقرأ: «نعم، المقاس L متوفر»", "كل رد يُراجع قبل إرساله"]
      - ["🔢", "$45 · 15/11 · +971 50…", "الأسعار والأرقام لا تتغير أبدًا"]
      - ["🎤", "جارٍ التفريغ… 64%", "تقدّم مباشر للرسائل الصوتية الطويلة"]
      - ["🛡", "100% على جهازك", "لا يرى محادثاتك أي مترجم سحابي"]
