      - {id: telegram, icon: "✈️", label: "تيليجرام", cap: "تيليجرام يعمل بنفس الطريقة — كل محادثة مترجمة، وكل رد يُرسل بلغة العميل."}
      - {id: chat, icon: "🌐", label: "ترجمة المحادثات", cap: "العملاء يكتبون بلغتهم وأنت تقرأ بالعربية. قبل الإرسال ترى ما الذي سيقرؤونه."}
      - {id: notify, icon: "🔔", label: "الإشعارات", cap: "كل إشعار يوضح الحساب الذي يخصّه — ومترجم مسبقًا. اضغط عليه فتُفتح المحادثة الصحيحة."}
      - {id: voice, icon: "🎤", label: "الرسائل الصوتية", cap: "بنقرة واحدة تتحول الرسالة الصوتية إلى نص مترجم إلى العربية — مع تقدّم مباشر للطويلة منها."}
      - {id: photo, icon: "📷", label: "الصور", cap: "صور الفواتير والطلبات والمستندات: يُقرأ النص ويُترجم."}
    - type: facts
      label: "حقائق أساسية"
      items: [["2 + 3", "واتساب وتيليجرام، + 3 تطبيقات تجريبية"], ["27+", "حسابًا في وقت واحد (مُختبر)"], ["49", "لغة ترجمة بدون إنترنت"], ["0", "رسالة تُرسل إلى مترجم سحابي"]]
    - type: apps
      id: apps
      k: "تطبيق واحد لكل المحادثات"
      h: "عملاؤك على واتساب <em>و</em>تيليجرام. والآن أنت أيضًا — في مكان واحد."
      p: "كل حساب يعمل في مساحته المغلقة: تسجيل دخول وإشعارات خاصة به، وبروكسي خاص إن أردت."
      items:
      - {icon: wa, cls: wa, name: "واتساب وواتساب للأعمال", p: "كل رقم يستخدمه نشاطك — امسح الرمز مرة واحدة ويبقى متصلًا. المحادثات والرسائل الصوتية والصور مترجمة.", link: "whatsapp-translator", more: "مترجم واتساب"}
      - {icon: tg, cls: tgc, name: "تيليجرام", p: "كل حسابات تيليجرام جنبًا إلى جنب — الشخصي والمتجر والدعم. سجّل الدخول برمز QR أو برقم هاتفك. المحادثات مترجمة في الاتجاهين.", link: "telegram-translator", more: "مترجم تيليجرام"}
      - {icon: ms, cls: beta, beta: true, name: "ماسنجر", p: "صندوق رسائل فيسبوك ماسنجر مع ترجمة تحت الرسائل وزر ترجمة لردودك."}
      - {icon: ig, cls: beta, beta: true, name: "رسائل إنستغرام", p: "رسائل العملاء على إنستغرام مترجمة تحت كل رسالة؛ وردّك يُترجم قبل إرساله."}
      - {icon: dc, cls: beta, beta: true, name: "ديسكورد", p: "السيرفرات والرسائل الخاصة مع ترجمة كل رسالة وما تكتبه."}
      note: "التطبيقات التجريبية مشمولة في كل الباقات. تترجم الرسائل النصية؛ أما الرسائل الصوتية والصور فتُترجم في واتساب وتيليجرام."
    - type: showcase
      id: features
      k: "كيف يعمل"
      h: "شاهد GlotChat أثناء العمل — في مقاطع قصيرة"
      rows:
      - media: "video:accounts"
        h: "كل رقم وكل حساب في نافذة واحدة"
        p: "أضف ما تحتاجه من حسابات واتساب وتيليجرام. كل حساب منفصل بتسجيل دخوله ولونه ولغاته وإشعاراته."
        ticks: ["امسح رمز QR مرة واحدة — ويبقى متصلًا", "مُختبر مع 27 حسابًا في الوقت نفسه", "بروكسي اختياري لكل حساب، يُفحص كل دقيقة"]
      - media: "video:telegram"
        tag: "جديد في 1.3"
        h: "تيليجرام مترجم مثل واتساب"
        p: "افتح محادثة تيليجرام وستجد كل رسالة مترجمة إلى العربية. اكتب ردك بالعربية — ويستلم العميل لغته."
        ticks: ["تسجيل الدخول برمز QR أو برقم الهاتف", "ترجمة تحت كل رسالة، في الاتجاهين", "قوالب الردود السريعة تعمل في تيليجرام أيضًا"]
        link: ["telegram-translator", "المزيد عن مترجم تيليجرام"]
      - media: "video:chat"
        h: "اعرف ما سيقرؤه العميل — قبل أن ترسل"
        p: "اكتب بالعربية واضغط Enter. يعرض GlotChat الترجمة ونفس النص مترجمًا عكسيًا إلى العربية، لتتأكد أنه يقول ما تقصده."
        ticks: ["مراجعة «سيقرأ» تحت كل ترجمة", "التحقق من الأسعار والتواريخ وأرقام الهواتف", "«صياغة أخرى» تعطيك عدة طرق للتعبير"]
      - media: "video:voice"
        h: "الرسائل الصوتية ← نص بلغتك"
        p: "لم تفهم رسالة صوتية؟ نقرة واحدة وتقرؤها — حتى لو كانت 5 دقائق، مع شريط تقدّم ونص يظهر أثناء التفريغ."
        ticks: ["حوالي 100 لغة منطوقة", "بدون إنترنت — الصوت يبقى على جهازك", "انسخ النص أو الترجمة بنقرة واحدة"]
      - media: "video:photo"
        h: "اقرأ النص في الصور والمستندات"
        p: "الفواتير والطلبات وقوائم الأسعار ولقطات الشاشة — تُقرأ وتُترجم بنقرة واحدة."
        ticks: ["اللاتينية والعربية والسيريلية والصينية وغيرها", "لا يتلقى العميل أي إشعار"]
      extras: ["⚡ قوالب ردود سريعة", "🔔 الإشعارات تذكر اسم الحساب", "🛡 ترجمة خاصة بدون إنترنت", "🩹 الحسابات المتوقفة تُعاد تلقائيًا", "🀄 واجهة إنجليزية وصينية"]
    - type: trust
      id: trust
      k: "ترجمة يمكنك الوثوق بها"
      h: "سعر خاطئ واحد قد يخسرك عميلًا. GlotChat يراجع كل ترجمة."
      p: "الترجمة الآلية سريعة لكنها ليست مثالية. لذلك يرتّب GlotChat أسلوب كتابة المحادثات قبل الترجمة، ويتحقق من النتيجة قبل إرسال أي شيء."
      items:
      - h: "شاهد بالضبط ما سيقرؤه العميل"
        p: "تحت كل ترجمة يعرض GlotChat نفس النص مترجمًا عكسيًا إلى العربية. إذا تغيّر المعنى تراه قبل العميل — ويمكنك التعديل أو اختيار صياغة أخرى."
        wide: true
        mock:
          top: "<span>إرسال بـ <b>الإنجليزية</b></span><span>من العربية</span>"
          input: "هل يمكنك إرسال 3 صناديق قبل يوم الجمعة؟ المجموع 45 دولارًا"
          main: "Can you send 3 boxes by Friday? The total is $45"
          notes: [["back", "↩ سيقرأ: هل يمكنك إرسال 3 صناديق بحلول الجمعة؟ المجموع 45 دولارًا"]]
      - h: "الأسعار والأرقام لا تتغير أبدًا"
        p: "الأسعار والكميات والتواريخ والأوقات وأرقام الطلبات وأرقام الهواتف والروابط تُفحص في كل ترجمة. الرقم المتغيّر يُعاد، والمفقود يُنبَّه عليه."
        mock:
          input: "Order #4521: 1,250.50 EUR. Call +33 6 12 34 56 78 at 3:30pm."
          arrow: true
          main: "الطلب رقم 4521: 1,250.50 يورو. اتصل على +33 6 12 34 56 78 الساعة 3:30pm."
          rtl: true
          notes: [["ok", "✓ 4521 · 1,250.50 · +33 6 12 34 56 78 — كلها محفوظة"]]
      - h: "يفهم طريقة الكتابة الحقيقية في المحادثات"
        p: "«how r u pls send ur address thx»، الأحرف الكبيرة، «مرحبااااا»، اللهجات العربية — يحوّل GlotChat كتابة المحادثات الحقيقية إلى جمل واضحة يفهمها المترجم."
        mock:
          input: "شلونك حبيبي، وين الطلب؟ بدي اعرف امتى يوصل"
          arrow: true
          main: "How are you, dear? Where's the order? I want to know when it arrives"
          notes: [["info", "how r u? pls send ur address thx ← «كيف حالك؟ أرجوك أرسل عنوانك، شكرًا»"]]
      - h: "لم تعجبك؟ اختر صياغة أخرى"
        p: "نقرة على «صياغة أخرى» تعرض عدة طرق لقول الشيء نفسه — كل منها مع ما سيقرؤه العميل."
        mock:
          top: "<span>🔁 <b>صياغة أخرى</b></span><span>الفرنسية</span>"
          chips: ["Pouvez-vous m'envoyer la liste des prix aujourd'hui ?", "Tu peux m'envoyer la liste des prix aujourd'hui ?", "Pouvez-vous m'envoyer la liste de prix aujourd'hui ?"]
      - h: "أسماؤك التجارية تبقى كما هي"
        p: "أضف اسم متجرك وعلامتك ومنتجاتك إلى قائمة «لا تُترجم» مرة واحدة. لن تتغير أبدًا — في أي محادثة وبأي لغة."
        mock:
          input: "اطلب من GlotShop بالكود SAVE20"
          arrow: true
          main: "Order from GlotShop with the code SAVE20"
          notes: [["ok", "✓ «GlotShop» في قائمة الكلمات التي لا تُترجم"]]
      cta: "جرّب الترجمة مجانًا 3 أيام"
    - type: cards
      id: who
      who: true
      soft: true
      k: "لمن هذا"
      h: "صُمّم للشركات التي يتحدث عملاؤها لغة أخرى"
      p: "إذا كنت تردّ على عملاء من دول مختلفة — على أكثر من رقم أو تطبيق — يوفّر لك GlotChat ساعات كل يوم."
      cta: "أخبرنا عن نشاطك — وسنريك كيف يناسبك"
      items:
      - {icon: "🏠", h: "وكالات العقارات", p: "المشترون الأجانب يرسلون رسائل صوتية وصور مستندات. افهمها فورًا ولا تفوّت أي عميل على رقم أي وكيل.", pair: "العربية ⇄ English · Русский", link: "for/real-estate"}
      - {icon: "🩺", h: "العيادات والسياحة العلاجية", p: "نافذة واحدة لأرقام كل المنسقين. المرضى يكتبون بلغتهم وفريقك يجيب بلغتهم.", pair: "العربية ⇄ Türkçe · English", link: "for/clinics"}
