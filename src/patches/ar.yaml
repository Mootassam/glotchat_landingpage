      - ["كيف أدفع وأحصل على البرنامج؟", "حمّل التجربة المجانية من هذا الموقع. عندما تكون جاهزًا، راسلنا على تيليجرام واختر باقتك وادفع بـ USDT (TRC20 أو BEP20 أو ERC20). يصلك مفتاح الترخيص خلال دقائق، ونساعدك في الإعداد إن احتجت."]
