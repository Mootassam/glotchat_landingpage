# 2026-10 update: Messenger, Instagram and Discord out of beta — new pages (applied with src/merge_content.py)
pages:
  # ================================================================ ALL-IN-ONE (new)
  all-in-one-messenger:
    title: "All-in-One Messenger App for PC with Translation | GlotChat"
    description: "WhatsApp, Telegram, Messenger, Instagram and Discord in one window on Windows. Many accounts per app, each isolated, every chat translated. Free trial."
    keywords: "all in one messenger, all in one messenger app for pc, multi messenger app, unified inbox whatsapp telegram messenger, manage multiple social media accounts, all in one chat app windows"
    short: "All-in-one messenger"
    icon: "🧩"
    og_heading: "WhatsApp, Telegram, Messenger, Instagram & Discord — one window"
    blocks:
      - type: hero
        k: "All-in-one messenger for PC"
        h1: "Every chat app, every account — <span class=\"grad\">one window, your language</span>"
        lead: "WhatsApp, Telegram, Messenger, Instagram and Discord side by side on your PC. Add several accounts of each app, switch with one click, and read and answer every customer in their language — translated offline, checked before you send."
        media: "video:apps"
        media_alt: "Switching between WhatsApp, Telegram, Messenger, Instagram and Discord in GlotChat, each chat translated"
      - type: facts
        label: "Key facts"
        items: [["5", "chat apps in one window"], ["27+", "accounts at once (tested)"], ["49", "translation languages, offline"], ["1", "plan for every app"]]
      - type: table
        id: apps
        k: "Supported apps"
        h: "What GlotChat does in each app"
        cols: ["", "WhatsApp", "Telegram", "Messenger", "Instagram", "Discord"]
        rows:
          - ["Several accounts side by side", "✓", "✓", "✓", "✓", "✓"]
          - ["Messages translated under the original", "✓", "✓", "✓", "✓", "✓"]
          - ["Your reply translated before sending", "✓", "✓", "✓", "✓", "✓"]
          - ["“They will read” check + other wordings", "✓", "✓", "✓", "✓", "✓"]
          - ["Notifications name the account", "✓", "✓", "✓", "✓", "✓"]
          - ["Proxy per account", "✓", "✓", "✓", "✓", "✓"]
          - ["Voice notes → text", "✓", "✓", "✕", "✕", "✕"]
          - ["Text in photos translated", "✓", "✓", "✕", "✕", "✕"]
          - ["Quick-reply templates", "✓", "✓", "✕", "✕", "✕"]
        note: "In every app you can also select any text and translate it with one click."
      - type: cards
        soft: true
        k: "One window instead of five"
        h: "Stop switching between apps, tabs and phones"
        items:
          - {icon: "🔒", h: "Every account sealed", p: "Each account — in every app — has its own session and storage. Logins never mix, like separate computers in one app."}
          - {icon: "🔔", h: "Know who wrote, where", p: "Unread counts per app and per account, and every notification names the account. Click it and the right chat opens."}
          - {icon: "🌐", h: "Every chat translated", p: "Incoming messages are translated under the original; your replies are translated before you send them — in all five apps."}
          - {icon: "↩", h: "Checked before it's sent", p: "See what the customer will read, translated back into your language. Not happy? Pick another wording."}
          - {icon: "🌍", h: "Proxy per account", p: "Give any account its own HTTP or SOCKS5 proxy — useful when you sell in several countries."}
          - {icon: "🛡", h: "Offline & private", p: "Translation runs on your PC. No chat is sent to an online translator or AI service."}
      - type: steps
        k: "How it works"
        h: "Add your apps in a few minutes"
        items:
          - ["Add an account", "Click Add account and pick the app: WhatsApp, Telegram, Messenger, Instagram or Discord. Give it a name and your language."]
          - ["Log in once", "Scan the QR code (WhatsApp, Telegram) or log in with your usual username and password (Messenger, Instagram, Discord). It stays logged in."]
          - ["Chat in any language", "Open a chat: messages are already in your language. Write in yours — the customer reads theirs."]
        cta: "Download & try all apps free"
      - type: faq
        soft: true
        k: "FAQ"
        h: "All-in-one messenger — questions"
        items:
          - ["Which apps does GlotChat support?", "WhatsApp and WhatsApp Business, Telegram, Facebook Messenger, Instagram Direct and Discord. All of them are included in every plan."]
          - ["Can I add several accounts of the same app?", "Yes. Add as many accounts as your plan allows — for example 3 WhatsApp numbers, 2 Telegram accounts and 2 Instagram accounts. Each one is isolated."]
          - ["How are accounts counted in the plans?", "All apps count together: Starter includes 5 accounts, Pro 15 and Business unlimited — mix the apps any way you like."]
          - ["Are voice notes and photos translated in every app?", "Voice notes and text in photos are translated on WhatsApp and Telegram. On Messenger, Instagram and Discord, text messages are translated both ways."]
          - ["Is it the official WhatsApp, Telegram, Messenger, Instagram and Discord?", "Yes. GlotChat opens each app's official website in its own isolated session — like a browser, just organised and translated. It never sends anything by itself."]
          - ["Does it work on Mac or phone?", "GlotChat is a Windows 10 / 11 desktop app. Your phones keep working normally."]
      - type: related
        k: "Keep exploring"
        h: "Related"
        items: ["messenger-translator", "instagram-dm-translator", "discord-translator"]

