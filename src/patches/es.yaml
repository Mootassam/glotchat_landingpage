      items:
      - ["¿Hay prueba gratis?", "Sí. Descarga GlotChat, ábrelo y haz clic en «Empezar mi prueba gratis de 3 días» — todo se activa al instante, sin pago. Si te gusta, compras un plan y conservas todas tus cuentas y ajustes."]
