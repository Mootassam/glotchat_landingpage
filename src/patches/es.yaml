      - ["¿Funciona en Mac o en el móvil?", "GlotChat es una app de escritorio para Windows. Tus teléfonos siguen funcionando con normalidad — GlotChat es un dispositivo vinculado, como WhatsApp Web o Telegram Desktop."]
