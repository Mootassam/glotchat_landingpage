      k: "Traducción de confianza"
      h: "Un precio equivocado puede costarte un cliente. GlotChat revisa cada traducción."
      p: "La traducción automática es rápida pero no perfecta. Por eso GlotChat ordena la escritura de chat antes de traducir y comprueba el resultado antes de que salga nada."
      items:
      - h: "Ve exactamente qué leerá el cliente"
        p: "Bajo cada traducción, GlotChat muestra el mismo texto traducido de vuelta al español. Si el sentido cambió, lo ves antes que el cliente — y puedes editar o elegir otra forma."
        wide: true
        mock:
          top: "<span>Enviar en <b>árabe</b></span><span>desde español</span>"
          input: "¿Puedes enviar 3 cajas antes del viernes? Total 45 $"
          main: "هل يمكنك إرسال 3 صناديق بحلول يوم الجمعة؟ المجموع 45 دولارًا"
          rtl: true
          notes: [["back", "↩ Leerá: ¿Puedes enviar 3 cajas antes del viernes? Total 45 $"]]
      - h: "Los precios y números nunca cambian"
        p: "Precios, cantidades, fechas, horas, números de pedido y de teléfono y enlaces se comprueban en cada traducción. Un número cambiado se corrige; uno que falta se señala."
        mock:
          input: "Pedido #4521: 1.250,50 EUR. Llama al +33 6 12 34 56 78 a las 15:30."
          arrow: true
          main: "Commande n° 4521 : 1 250,50 EUR. Appelez le +33 6 12 34 56 78 à 15:30."
          notes: [["ok", "✓ 4521 · 1.250,50 · +33 6 12 34 56 78 · 15:30 — todo intacto"]]
      - h: "Entiende cómo escribe la gente de verdad"
        p: "«how r u pls send ur address thx», MAYÚSCULAS, «holaaaa», dialecto árabe — GlotChat convierte la escritura real de chat en frases claras que el traductor entiende."
        mock:
          input: "how r u? pls send ur address thx"
          arrow: true
          main: "¿Cómo estás? Por favor, envía tu dirección, gracias"
          notes: [["info", "También dialecto árabe: «مرحبااااا كيفك» → «Hola, ¿cómo estás?»"]]
      - h: "¿No te convence? Elige otra forma"
        p: "Un clic en «Otra forma» muestra varias maneras de decir lo mismo — cada una con lo que leerá el cliente."
        mock:
          top: "<span>🔁 <b>Otra forma</b></span><span>francés</span>"
          chips: ["Pouvez-vous m'envoyer la liste des prix aujourd'hui ?", "Tu peux m'envoyer la liste des prix aujourd'hui ?", "Pouvez-vous m'envoyer la liste de prix aujourd'hui ?"]
      - h: "Tus marcas siguen siendo tuyas"
        p: "Añade una vez los nombres de tu tienda, marca y productos a la lista «No traducir». Nunca cambian — en ningún chat ni idioma."
