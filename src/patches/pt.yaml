      - h: "Veja exatamente o que o cliente vai ler"
        p: "Embaixo de cada tradução, o GlotChat mostra o mesmo texto traduzido de volta para o português. Se o sentido mudou, você vê antes do cliente — e pode editar ou escolher outra forma."
        wide: true
        mock:
          top: "<span>Enviar em <b>árabe</b></span><span>do português</span>"
          input: "Você consegue enviar 3 caixas até sexta? Total de US$ 45"
          main: "هل يمكنك إرسال 3 صناديق بحلول يوم الجمعة؟ المجموع 45 دولارًا"
          rtl: true
          notes: [["back", "↩ Ele vai ler: Você consegue enviar 3 caixas até sexta? Total de US$ 45"]]
      - h: "Preços e números nunca mudam"
        p: "Preços, quantidades, datas, horários, números de pedido e de telefone e links são conferidos em cada tradução. Um número alterado é corrigido; um que falta é sinalizado."
        mock:
          input: "Pedido #4521: 1.250,50 EUR. Ligue para +33 6 12 34 56 78 às 15:30."
          arrow: true
          main: "Commande n° 4521 : 1 250,50 EUR. Appelez le +33 6 12 34 56 78 à 15:30."
          notes: [["ok", "✓ 4521 · 1.250,50 · +33 6 12 34 56 78 · 15:30 — tudo mantido"]]
      - h: "Entende como as pessoas escrevem de verdade"
        p: "“how r u pls send ur address thx”, LETRAS MAIÚSCULAS, “oiiiii”, dialeto árabe — o GlotChat transforma a escrita real de chat em frases claras que o tradutor entende."
        mock:
          input: "how r u? pls send ur address thx"
          arrow: true
          main: "Como você está? Por favor, mande seu endereço, obrigado"
          notes: [["info", "Dialeto árabe também: “مرحبااااا كيفك” → “Oi, tudo bem?”"]]
      - h: "Não gostou? Escolha outra forma"
        p: "Um clique em “Outra forma” mostra jeitos diferentes de dizer a mesma coisa — cada um com o que o cliente vai ler."
        mock:
          top: "<span>🔁 <b>Outra forma</b></span><span>francês</span>"
          chips: ["Pouvez-vous m'envoyer la liste des prix aujourd'hui ?", "Tu peux m'envoyer la liste des prix aujourd'hui ?", "Pouvez-vous m'envoyer la liste de prix aujourd'hui ?"]
      - h: "Suas marcas continuam suas"
        p: "Coloque os nomes da sua loja, marca e produtos na lista “Não traduzir” uma vez. Eles nunca mudam — em nenhuma conversa, em nenhum idioma."
