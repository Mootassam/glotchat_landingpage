      items:
      - ["Existe teste grátis?", "Sim. Baixe o GlotChat, abra e clique em “Iniciar meu teste grátis de 3 dias” — tudo é liberado na hora, sem pagamento. Se gostar, você compra um plano e mantém todas as contas e configurações."]
