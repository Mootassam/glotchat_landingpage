      - ["Que computador eu preciso?", "Windows 10 ou 11 (64 bits). Cada conta usa cerca de 300–450 MB de memória: 8 GB de RAM dão para umas 10 contas, 16 GB ou mais para 20–30."]
      - ["Como eu pago e recebo o programa?", "Baixe o teste grátis neste site. Quando quiser comprar, fale com a gente no Telegram, escolha o plano e pague em USDT (TRC20, BEP20 ou ERC20). Sua chave chega em minutos, e ajudamos na configuração se precisar."]
      - ["Funciona no Mac ou no celular?", "O GlotChat é um app de desktop para Windows. Seus celulares continuam funcionando normalmente — o GlotChat é um dispositivo conectado, como o WhatsApp Web ou o Telegram Desktop."]
