      k: "Tradução confiável"
      h: "Um preço errado pode custar um cliente. O GlotChat confere cada tradução."
      p: "A tradução automática é rápida, mas não é perfeita. Por isso o GlotChat organiza a escrita de chat antes de traduzir e confere o resultado antes de qualquer envio."
