      - ["É seguro para minhas contas?", "O GlotChat abre o WhatsApp Web e o Telegram Web oficiais para cada conta, numa sessão isolada — exatamente como um navegador, só que organizado. Ele nunca envia mensagens sozinho: tudo é enviado por você. Como em qualquer mensageiro, evite spam e envios em massa não solicitados."]
