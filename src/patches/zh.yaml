      - {icon: "✈️", h: "旅游和出行", p: "来自世界各地游客的预订、变更和问题 —— 一台电脑全部处理。", pair: "中文 ⇄ Français · Italiano", link: "for/travel"}
      - {icon: "🎧", h: "客服和销售团队", p: "员工用中文工作，每位客户都在 WhatsApp 和 Telegram 上收到他自己语言的回复。", pair: "中文 ⇄ English · Tiếng Việt"}
