      k: "可以信赖的翻译"
      h: "一个错误的价格就可能丢掉客户。GlotChat 会检查每一条译文。"
      p: "机器翻译速度快，但并不完美。所以 GlotChat 在翻译前先整理聊天式的写法，在发送前再检查结果。"
