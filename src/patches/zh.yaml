        p: "“how r u pls send ur address thx”、全大写、“hiiiii”、阿拉伯语方言 —— GlotChat 先把这些整理成规范句子，再交给翻译。"
        mock:
          input: "how r u? pls send ur address thx"
          arrow: true
          main: "你好吗？请把你的地址发给我，谢谢"
          notes: [["info", "阿拉伯语方言也可以：“مرحبااااا كيفك” → “你好，最近怎么样？”"]]
      - h: "不满意？换个说法"
        p: "点一下“换个说法”，就能看到几种不同的表达方式 —— 每一种都附带回译。"
        mock:
          top: "<span>🔁 <b>换个说法</b></span><span>法语</span>"
          chips: ["Pouvez-vous m'envoyer la liste des prix aujourd'hui ?", "Tu peux m'envoyer la liste des prix aujourd'hui ?", "Pouvez-vous m'envoyer la liste de prix aujourd'hui ?"]
