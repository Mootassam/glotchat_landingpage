        p: "每条译文下方，GlotChat 都会把它再翻译回中文。如果意思变了，你会比客户先发现 —— 可以直接修改，或换一种说法。"
        wide: true
        mock:
          top: "<span>以 <b>阿拉伯语</b> 发送</span><span>原文：中文</span>"
          input: "周五前能发 3 箱吗？总共 45 美元"
          main: "هل يمكنك إرسال 3 صناديق بحلول يوم الجمعة؟ المجموع 45 دولارًا"
          rtl: true
          notes: [["back", "↩ 对方将读到：周五前能发 3 箱吗？总共 45 美元"]]
      - h: "价格和数字绝不会被改错"
        p: "价格、数量、日期、时间、订单号、电话号码和链接，每条译文都会检查。被改动的数字会自动改回；缺少的数字会提醒你。"
        mock:
          input: "订单 #4521：1,250.50 欧元。下午 3:30 打 +33 6 12 34 56 78。"
          arrow: true
          main: "Commande n° 4521 : 1 250,50 EUR. Appelez le +33 6 12 34 56 78 à 15h30."
          notes: [["ok", "✓ 4521 · 1,250.50 · +33 6 12 34 56 78 —— 全部保留"]]
