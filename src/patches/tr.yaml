      - {icon: "🚢", h: "İhracatçılar ve toptancılar", p: "WhatsApp ve Telegram'da Arapça, Rusça, İspanyolca alıcılarla teklif verin, pazarlık yapın — siz Türkçe yazın.", pair: "Türkçe ⇄ العربية · Русский", link: "for/exporters"}
      - {icon: "✈️", h: "Turizm ve seyahat", p: "Dünyanın her yerinden turistlerin rezervasyon, değişiklik ve soruları — tek bilgisayardan.", pair: "Türkçe ⇄ English · Deutsch", link: "for/travel"}
      - {icon: "🛒", h: "E-ticaret ve bayiler", p: "Her mağaza veya ülke için ayrı numara, hızlı yanıt şablonları, sipariş ve dekont fotoğraflarının çevirisi.", pair: "Türkçe ⇄ English · Español"}
      - {icon: "🎧", h: "Destek ve satış ekipleri", p: "Çalışanlarınız kendi dilinde çalışır; her müşteri kendi dilinde yanıt alır — WhatsApp'ta ve Telegram'da.", pair: "Türkçe ⇄ English · Русский"}
    - type: vs
      k: "Neden GlotChat"
      h: "Çevirmenlere kopyala-yapıştırı bırakın"
      bad_h: "GlotChat olmadan"
      bad: ["Her hesap için bir telefon, tarayıcı profili veya uygulama", "Her mesaj için kopyala → yapıştır → çevir → geri yapıştır", "Çevirinin doğru anlamı verdiğini ummak", "Anlamadığınız sesli mesajlar", "Müşteri sohbetleri çevrimiçi çevirmenlere yapıştırılıyor"]
      good_h: "GlotChat ile"
      good: ["WhatsApp ve Telegram hesapları tek pencerede, bir tık uzakta", "Çeviri her mesajın altında otomatik görünür", "Göndermeden önce müşterinin ne okuyacağını görürsünüz", "Sesli mesajlar kendi dilinizde metne dönüşür", "Her şey kendi bilgisayarınızda çevrimdışı çevrilir"]
