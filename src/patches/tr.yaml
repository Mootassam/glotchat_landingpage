      k: "Ödemeden önce deneyin"
      h: "3 gün ücretsiz. 10 dakikada hazır."
      items:
      - ["GlotChat'i indirin", "Windows kurulum dosyasını sitemizden alın ve yaklaşık bir dakikada kurun — yönetici yetkisi gerekmez."]
      - ["Ücretsiz denemenizi tek tıkla başlatın", "GlotChat'i açın ve “3 günlük ücretsiz denememi başlat”a tıklayın. Tüm özellikler hemen açılır — ödeme yok, mesaj yok."]
      - ["Beğendiniz mi? Devam edin.", "USDT ile ödeyin ve yıllık anahtarınızı alın. Hesaplarınız ve ayarlarınız olduğu gibi kalır — yeniden kurulum yok."]
