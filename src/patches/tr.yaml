      more: "Paketleri ayrıntılı karşılaştırın"
      soft: false
    - type: faq
      k: "SSS"
      h: "Sorular ve yanıtlar"
      items:
      - ["Ücretsiz deneme var mı?", "Evet. GlotChat'i indirin, açın ve “3 günlük ücretsiz denememi başlat”a tıklayın — tüm özellikler hemen açılır, ödeme gerekmez. Beğenirseniz bir paket alır, tüm hesaplarınızı ve ayarlarınızı korursunuz."]
      - ["Telegram ile çalışıyor mu?", "Evet. 1.3 sürümünden beri WhatsApp numaralarınızın yanına Telegram hesapları ekleyebilirsiniz. Her biri QR kodla veya telefon numarasıyla giriş yapar; sohbetler WhatsApp'taki gibi iki yönlü çevrilir."]
      - ["Hesaplarım için güvenli mi?", "GlotChat her hesap için resmi WhatsApp Web ve Telegram Web'i kendi yalıtılmış oturumunda açar — tıpkı bir tarayıcı gibi, sadece düzenli. Kendi başına mesaj göndermez: her şeyi siz gönderirsiniz. Her mesajlaşma uygulamasında olduğu gibi spam ve toplu istenmeyen mesajlardan kaçının."]
      - ["Çeviri ne kadar iyi?", "Günlük iş yazışmaları için çok iyi — fiyatlar, siparişler, randevular, sorular. Üstelik tahmin etmeniz gerekmez: göndermeden önce GlotChat müşterinin ne okuyacağını gösterir, her rakamı kontrol eder ve başka ifadeler sunar. Sözleşme veya tıbbi metinleri bir uzmana kontrol ettirin."]
