<!doctype html>
<html><head><meta charset="utf-8"><title>GlotChat demo scenes</title>

<style>

<script>
const Q = new URLSearchParams(location.search);
const LANG = Q.get('lang') || 'en', SCENE = Q.get('scene') || 'chat', FMT = Q.get('fmt') === 'port' ? 'port' : 'land';

/* ======================= timeline engine (seekable: any frame can be rendered in any order) ======================= */
const T = [], TY = [], CL = [], CAM = [];
const ease = (x) => 1 - Math.pow(1 - x, 3);
const easeIO = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const h = (html) => { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; };
const stage = document.getElementById('stage');
function tween(el, t0, d, props, e = ease) { T.push({ el, t0, d, props, e }); return el; }
function show(el, t0, d = 0.35, dy = 10) { return tween(el, t0, d, { opacity: [0, 1], y: [dy, 0] }); }
function pop(el, t0, d = 0.3) { return tween(el, t0, d, { opacity: [0, 1], scale: [0.6, 1] }, (x) => 1 + 2.2 * Math.pow(x - 1, 3) + 1.2 * Math.pow(x - 1, 2)); }
function hide(el, t0, d = 0.25) { return tween(el, t0, d, { opacity: [1, 0] }); }
function type(el, t0, text, cps = 18, caret = true) { TY.push({ el, t0, text, cps, caret }); return t0 + [...text].length / cps; }

/* camera: at time t, move over d seconds to [x, y, zoom] (stage pixels) — one target for landscape, one for portrait */
function cam(t, d, land, port) { const [x, y, z] = FMT === 'port' ? port : land; CAM.push({ t, d, x, y, z }); }
function pos(el, fx = 0.5, fy = 0.5) {   // a point inside an element, in stage pixels (measured before the camera moves)
  const s = stage.getBoundingClientRect(), r = el.getBoundingClientRect();
  return [r.left - s.left + r.width * fx, r.top - s.top + r.height * fy];
}
function seek(t) {
  const st = new Map();
  for (const a of T.slice().sort((p, q) => p.t0 - q.t0)) {
    const s = st.get(a.el) || {};
    for (const p in a.props) {
      const [f, to] = a.props[p];
      if (!(p in s)) s[p] = f;
      if (t >= a.t0) { const k = Math.min(1, (t - a.t0) / a.d); s[p] = f + (to - f) * a.e(k); }
    }
    st.set(a.el, s);
  }
  for (const [el, s] of st) {
    if ('opacity' in s) el.style.opacity = Math.max(0, Math.min(1, s.opacity)).toFixed(3);
    const tr = [];
    if ('x' in s || 'y' in s) tr.push(`translate(${(s.x || 0).toFixed(1)}px, ${(s.y || 0).toFixed(1)}px)`);
    if ('scale' in s) tr.push(`scale(${s.scale.toFixed(3)})`);
    if (tr.length) el.style.transform = (el.dataset.base || '') + ' ' + tr.join(' ');
    if ('h' in s) el.style.maxHeight = Math.max(0, s.h).toFixed(0) + 'px';
  }
  const byEl = new Map();
  for (const y of TY) { if (!byEl.has(y.el)) byEl.set(y.el, null); if (t >= y.t0 && (!byEl.get(y.el) || y.t0 >= byEl.get(y.el).t0)) byEl.set(y.el, y); }
  const blink = Math.floor(t * 2.5) % 2 === 0;
  for (const [el, y] of byEl) {
    if (!y || !y.text) { el.innerHTML = el.dataset.empty || ''; continue; }
    const chars = [...y.text], n = Math.max(0, Math.min(chars.length, Math.floor((t - y.t0) * y.cps)));
    el.innerHTML = esc(chars.slice(0, n).join('')) + (y.caret && blink ? '<span class="caret"></span>' : '');
  }
  const cs = new Map();
  for (const c of CL.slice().sort((p, q) => p.t - q.t)) {
    const k = c.el; if (!cs.has(k)) cs.set(k, {});
    const m = cs.get(k); if (!(c.name in m)) m[c.name] = !c.on;
    if (t >= c.t) m[c.name] = c.on;
  }
  for (const [el, m] of cs) for (const n in m) el.classList.toggle(n, m[n]);
  // camera
  let cx = SW / 2, cy = SH / 2, z = Math.min(VW / SW, VH / SH);
  const ks = CAM.slice().sort((p, q) => p.t - q.t);
  if (ks.length) { cx = ks[0].x; cy = ks[0].y; z = ks[0].z; }
  for (const k of ks) {
    if (t < k.t) break;
    const f = k.d ? easeIO(Math.min(1, (t - k.t) / k.d)) : 1;
    cx += (k.x - cx) * f; cy += (k.y - cy) * f; z += (k.z - z) * f;
  }
  const clamp = (c, view, size) => (size * z <= view ? size / 2 : Math.max(view / (2 * z), Math.min(size - view / (2 * z), c)));
  cx = clamp(cx, VW, SW); cy = clamp(cy, VH, SH);
  stage.style.transform = `translate(${(VW / 2 - cx * z).toFixed(2)}px, ${(VH / 2 - cy * z).toFixed(2)}px) scale(${z.toFixed(4)})`;
  stage.style.borderRadius = z * SW < VW - 1 || z * SH < VH - 1 ? '14px' : '0';
}

/* cursor path: [t, x, y, click] in stage pixels */
function cursor(points) {
  const c = h(`<svg class="cursor" viewBox="0 0 24 24"><path d="M4 2l16 9.5-7.2 1.6L9.4 21z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg>`);
  stage.append(c); c.style.opacity = 0;
  let prev = null;
  for (const [t, x, y, click] of points) {
    if (!prev) tween(c, t, 0.3, { opacity: [0, 1], x: [x, x], y: [y + 24, y] });
    else tween(c, prev[0] + 0.05, Math.max(0.2, t - prev[0] - 0.05), { x: [prev[1], x], y: [prev[2], y] }, easeIO);
    if (click) {
      const r = h('<div class="ripple"></div>'); r.style.left = x + 5 + 'px'; r.style.top = y + 5 + 'px'; r.style.opacity = 0; stage.append(r);
      tween(r, t, 0.12, { opacity: [0, 1], scale: [0.4, 0.9] }); tween(r, t + 0.12, 0.38, { opacity: [1, 0], scale: [0.9, 1.7] });
    }
    prev = [t, x, y];
  }
  return c;
}
function ring(el, t0, t1, pad = 6) {
  const [x, y] = pos(el, 0, 0), r = el.getBoundingClientRect();
  const g = h('<div class="ring"></div>');
  Object.assign(g.style, { left: x - pad + 'px', top: y - pad + 'px', width: r.width + pad * 2 + 'px', height: r.height + pad * 2 + 'px', opacity: 0 });
  stage.append(g); tween(g, t0, 0.3, { opacity: [0, 1] }); tween(g, t1, 0.3, { opacity: [1, 0] });
}

function qrSvg() {   // decorative QR-like pattern (not a real code)

/* two-way chat translation: incoming translated, reply typed in my language, checked ("They will read"), sent in theirs */
function chatScene(c, tr, opt) {
  {
    shell(opt.accs, 0, c, rowsWith([c.who[0], c.who[1], c.who[2], c.in2, '10:44', ''], ''), { app: opt.app });
    const b1 = bubble('in', `${esc(c.in1)}<span class="tr" data-tr1>${badge(c.src)}${tt(tr[0])}</span>`, '10:43');
    const b2 = bubble('in', `${esc(c.in2)}<span class="tr" data-tr2>${badge(c.src)}${tt(tr[1])}</span>`, '10:44');
    ring($('.tools'), 0.5, 1.9, 4);
    show(b1, 1.9); show($('[data-tr1]'), 2.6, 0.45, 6);
    show(b2, 3.3); show($('[data-tr2]'), 4.0, 0.45, 6);
    const box = $('#box'); box.dataset.empty = `<span class="ph">${esc(U.type)}</span>`;
    const typedEnd = type(box, 5.1, tr[2], LANG === 'zh' ? 9 : 27);
    const panel = h(`<div class="panel"><div class="ph"><span>${esc(U.sendIn(U.lang[c.src]))}</span><span class="link">${esc(U.change)}</span></div>
      <div class="ta">${esc(c.out)}</div><div class="back" data-back><i>${esc(U.theyRead)}</i> ${esc(tr[3] || tr[2])}</div><div class="orig">${esc(U.wrote)} ${esc(tr[2])}</div>
      <div class="row2"><span class="hint">${esc(U.hint)}</span><span class="btn">${esc(U.other)}</span><span class="btn">${esc(U.orig)}</span><span class="btn pri" data-send>${esc(U.send)}</span></div></div>`);
    $('.chat').append(panel); panel.style.opacity = 0;
    show(panel, typedEnd + 0.4, 0.35, 14);
    const back = $('[data-back]', panel); back.style.opacity = 0;
    show(back, typedEnd + 1.1, 0.4, 4);
    ring(back, typedEnd + 1.3, typedEnd + 3.0, 3);
    const pSend = pos($('[data-send]', panel));
    const sendAt = typedEnd + 3.6;
    hide(panel, sendAt + 0.25, 0.2);
    TY.push({ el: box, t0: sendAt + 0.25, text: '', cps: 1, caret: false });
    const b3 = bubble('out', `${esc(c.out)}<span class="tr"><span class="badge grey">${esc(U.youWrote)}</span>${tt(tr[2])}</span>`, '10:45');
    show(b3, sendAt + 0.4, 0.4, 10);
    cursor([[typedEnd + 0.9, 900, 560], [sendAt - 0.4, pSend[0], pSend[1]], [sendAt, pSend[0], pSend[1], true], [sendAt + 1.2, 1000, 520]]);
    const pb1 = pos(b1, 0, 0), pb2 = pos(b2, 0, 1), pBox = pos(box, 0, 0.5), pPan = pos(panel, 0, 0.5), pb3 = pos(b3, 1, 0.5);
    cam(0, 0, [1060, 30, 1.7], [1060, 30, 1.3]);
    cam(1.7, 0.9, [760, 560, 1.4], [pb1[0] + 230, (pb1[1] + pb2[1]) / 2, 1.3]);
    cam(4.8, 0.7, [840, 650, 1.4], [pBox[0] + 230, pBox[1] - 140, 1.3]);
    cam(typedEnd + 0.3, 0.6, [840, 650, 1.4], [pPan[0] + 280, pPan[1] + 30, 1.12]);
    cam(sendAt + 0.3, 0.8, [840, 560, 1.32], [pb3[0] - 240, pb3[1] - 90, 1.3]);
    return sendAt + 3.4;
  }
}
