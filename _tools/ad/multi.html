         font-size: 26px; font-weight: 850; box-shadow: 0 18px 44px rgba(16,185,129,.55); }
  .cta svg { width: 29px; height: 29px; fill: #fff; }

              line-height: 1.3; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
  #ad:not(.story) .cap span { font-size: 18px; padding: 7px 14px; }

<script>
const Q = new URLSearchParams(location.search);
const LANG = Q.get('lang') || 'en', FMT = Q.get('fmt') === 'story' ? 'story' : 'feed';
const story = FMT === 'story', W = 540, H = story ? 960 : 675;
/* story keeps the important parts out of the top ~13 % and bottom ~27 % that Reels / Stories cover */
const L = story
  ? { cap: 702, ttl: 178, hookT: 150, sub: 700, phones: [[34, 262, -9], [208, 238, 4], [382, 266, 10], [116, 436, 7], [300, 448, -6]],
      winTop: 262, winH: 420, winW: 504, who: 280, chk: 540, card: 214, legal: 924, mark: 64 }
  : { cap: null, ttl: 20, hookT: 28, sub: 606, phones: [[30, 104, -9], [206, 84, 4], [382, 110, 10], [114, 336, 7], [298, 348, -6]],
      winTop: 100, winH: 500, winW: 504, who: 124, chk: 380, card: 74, legal: 650, mark: null };
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const eo = (x) => 1 - Math.pow(1 - clamp(x), 3);
const pr = (t, a, b) => eo((t - a) / (b - a));
const back = (x) => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const ad = document.getElementById('ad'); ad.style.height = H + 'px'; if (story) ad.classList.add('story');
const el = (html, parent = ad) => { const d = document.createElement('div'); d.innerHTML = html.trim(); const n = d.firstChild; parent.append(n); return n; };
const set = (n, o, x = 0, y = 0, s = 1, r = 0) => { n.style.opacity = o.toFixed(3); n.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) scale(${s.toFixed(3)}) rotate(${r.toFixed(2)}deg)`; n.style.visibility = o < 0.002 ? 'hidden' : 'visible'; };
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const pos = (n, y) => { n.style.top = y + 'px'; return n; };
const LOGO = '../../assets/img/icon-512.png';
const CHAT = '<svg viewBox="0 0 24 24"><path d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 4v-4H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm3 6.5a1.5 1.5 0 1 0 0 .01zm5 0a1.5 1.5 0 1 0 0 .01zm5 0a1.5 1.5 0 1 0 0 .01z"/></svg>';
const SEND = '<svg viewBox="0 0 24 24"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12.6 2-12.6 2z"/></svg>';
const CURSOR = '<svg class="cursor" viewBox="0 0 24 24"><path d="M4 2l15 11-6.5 1.2L16 21l-3 1.4-3.6-6.9L4 19z" fill="#fff" stroke="#0f172a" stroke-width="1.4" stroke-linejoin="round"/></svg>';
function qrSvg() {   // deterministic fake QR
  let s = 7, r = ''; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  for (let y = 0; y < 25; y++) for (let x = 0; x < 25; x++) {
    const f = (x < 7 && y < 7) || (x > 17 && y < 7) || (x < 7 && y > 17);
    if (f) { const lx = x > 17 ? x - 18 : x, ly = y > 17 ? y - 18 : y; if (lx === 0 || ly === 0 || lx === 6 || ly === 6 || (lx > 1 && lx < 5 && ly > 1 && ly < 5)) r += `<rect x="${x}" y="${y}" width="1" height="1"/>`; }
    else if (rnd() > 0.52) r += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  }
  return `<svg viewBox="-1 -1 27 27" fill="#0f172a">${r}</svg>`;
}

let D, SEC, T, G = {}, R = {};
function build() {
  T = D.text; SEC = D.sections; window.DURATION = D.duration;
  const bl = ad.querySelectorAll('.blob');
  Object.assign(bl[0].style, { width: '400px', height: '400px', left: '-150px', top: '-120px', background: 'rgba(16,185,129,.32)' });
  Object.assign(bl[1].style, { width: '440px', height: '440px', right: '-170px', top: H * 0.3 + 'px', background: 'rgba(217,70,239,.30)' });
  Object.assign(bl[2].style, { width: '420px', height: '420px', left: '-80px', bottom: '-180px', background: 'rgba(56,189,248,.26)' });
  R.blobs = [...bl];
  SEC.forEach((s) => { G[s.id] = el('<div class="g"></div>'); });
  const ACC = T.accounts;   // [name, colour, initial]
  // ---------- hook: five buzzing phones
  R.hookT = pos(el(`<div class="ttl">${T.hook.title}</div>`, G.hook), L.hookT);
  R.sub = pos(el(`<div class="sub">${esc(T.hook.sub)}</div>`, G.hook), L.sub);
  R.phG = el('<div class="g"></div>');
  R.phones = T.hook.phones.map((p, i) => {
    const [nm, col] = ACC[i];
    const n = el(`<div class="ph"><span class="tm">9:41</span><div class="acc" style="background:${col}33;color:${col}">${esc(nm)}</div>
      <div class="nt"><small>${esc(p.who)}</small><span dir="auto">${esc(p.m)}</span></div><div class="nt"><small>${esc(p.who2)}</small>${esc(p.m2)}</div>
      <div class="bd">${p.n}</div></div>`, R.phG);
    n.style.left = L.phones[i][0] + 'px'; n.style.top = L.phones[i][1] + 'px'; return n;
  });
  // ---------- the GlotChat window (brand → add → notify)
  const wl = (W - L.winW) / 2;
  R.win = el(`<div class="win"><div class="tbar"><i style="background:#ef4444"></i><i style="background:#f59e0b"></i><i style="background:#22c55e"></i><img src="${LOGO}">GlotChat</div>
    <div class="tabs"><div class="trow"></div><div class="plus">+</div></div><div class="body"></div></div>`);
  Object.assign(R.win.style, { top: L.winTop + 'px', width: L.winW + 'px', height: L.winH + 'px', marginLeft: -L.winW / 2 + 'px' });
  R.trow = R.win.querySelector('.trow'); R.body = R.win.querySelector('.body');
  R.tabs = ACC.map(([nm, col, ini]) => el(`<div class="tab"><div class="ic" style="background:${col}">${esc(ini)}<i></i></div>${esc(nm)}<span class="un" style="display:none">0</span><div class="bar" style="background:${col}"></div></div>`, R.trow));
  R.count = el('<div class="count"></div>');
  // splash
  R.splash = el(`<div class="splash"><img src="${LOGO}"><b>GlotChat</b></div>`, R.body);
  // chat list (behind the modal and the toasts)
  R.list = el(`<div class="list">${T.list.map(([n, m, c]) => `<div class="row"><div class="av" style="background:${c}">${esc(n[0])}</div><div class="t"><b>${esc(n)}</b><span>${esc(m)}</span></div></div>`).join('')}</div>`, R.body);
  // add-account modal
  const A = T.add;
  R.dim = el('<div class="dim"></div>', R.body);
  R.modal = el(`<div class="modal"><h4>${esc(A.h)}</h4>
    <div class="s1"><div class="fl">${esc(A.nameL)}</div><div class="inp"></div><div class="fl">${esc(A.langL)}</div>
      <div class="pills"><span class="on">${esc(A.pairA)}</span>⇄<span class="pb">${esc(A.pairB)}</span></div><div class="btn">${esc(A.next)}</div></div>
    <div class="s2"><div class="qrw"><div class="qr">${qrSvg()}<div class="ok"><div><span>✓</span>${esc(A.connected)}</div></div></div>
      <div class="mph"><div class="fr"><div class="ln"></div></div></div></div><div class="qhint">${esc(A.hint)}</div></div></div>`, R.body);
  R.modal.style.top = (story ? 14 : 30) + 'px';

  R.btn = R.modal.querySelector('.btn'); R.ok = R.modal.querySelector('.ok'); R.mph = R.modal.querySelector('.mph'); R.ln = R.modal.querySelector('.ln');
  // toasts

    <b>${esc(x.who)}</b><span class="bd2">🌐 ${x.code}</span>${esc(x.tr)}<div class="o">${esc(x.o)}</div></div>`, R.body));
  R.cursor = el(CURSOR, R.body); R.ripple = el('<div class="ripple"></div>', R.body);

  R.chat = el(`<div class="chat"><div class="chd"><div class="av">${esc(C.who[0])}</div><div><b>${esc(C.who)} · ${esc(C.acc)}</b><small>${esc(C.status)}</small></div>
    <div class="pair"></div></div><div class="cb"><div class="stack"></div></div>
    <div class="cp"><div class="box"></div><div class="send">${SEND}</div></div></div>`, R.body);
  R.stack = R.chat.querySelector('.stack'); R.box = R.chat.querySelector('.box'); R.sendB = R.chat.querySelector('.send');
  const item = (cls, html, mt) => { const n = el(`<div class="w ${cls}">${html}</div>`, R.stack); n.style.marginTop = mt + 'px'; return n; };
  R.items = [
    { n: item('in top', `<span class="o" dir="auto">${esc(C.in1)}</span>`, 0), ev: 'in1' },
    { n: item('in bot', `<span class="bd2">🌐 ${C.code1}</span>${esc(C.tr1)}`, 0), ev: 'tr1', reveal: true },
    { n: item('out', `<span class="o" dir="auto">${esc(C.out)}</span><span class="s2"><span class="bd2 g2">🌐 ${C.code2}</span>${esc(C.reply)}</span>`, 9), ev: 'out' },
    { n: item('in top', `<span class="o" dir="auto">${esc(C.in2)}</span>`, 9), ev: 'in2' },

  R.who = pos(el(`<div class="who">${P.items.map(([e, x]) => `<div><em>${e}</em>${esc(x)}</div>`).join('')}</div>`, G.proof), L.who);
  R.chk = pos(el(`<div class="chk">${P.checks.map((x) => `<div>${esc(x)}</div>`).join('')}</div>`, G.proof), L.chk);
  // ---------- end

  R.card = pos(el(`<div class="card"><img class="logo2" src="${LOGO}"><div class="mini">${ACC.slice(0, 6).map(([, c, i]) => `<i style="background:${c}">${esc(i)}</i>`).join('')}</div>
    <h2>${esc(E.h)}</h2><ul>${E.pts.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>

function measure() {
  const wl = (W - L.winW) / 2;
  R.tabX = R.tabs.map((t) => [t.offsetLeft, t.offsetWidth]);
  R.tabC = R.tabs.map((t) => [wl + 6 + t.offsetLeft + 20, L.winTop + 30 + 26]);
  R.phC = R.phones.map((p) => [p.offsetLeft + p.offsetWidth / 2, p.offsetTop + p.offsetHeight / 2]);
  R.items.forEach((it) => { it.h = it.n.offsetHeight + parseFloat(it.n.style.marginTop); });
  R.bodyW = L.winW; R.bodyH = L.winH - 82;
  R.toastPos = R.toasts.map((t, i) => [R.bodyW - t.offsetWidth - 12, R.bodyH - 12 - (R.toasts.length - i) * (t.offsetHeight + 8) + 8]);
  R.toasts.forEach((t, i) => { t.style.left = R.toastPos[i][0] + 'px'; t.style.top = R.toastPos[i][1] + 'px'; });

const S = (id) => SEC.find((s) => s.id === id);
function tabsAt(t) {   // how many tabs are visible, which one is active, unread counts
  const br = S('brand'), ad_ = S('add'), nt = S('notify');

  if (t >= br.start + 0.9) act = 0;

const F = {

    R.pb.classList.toggle('on', lt >= e.lang);

    set(R.mph, step2 ? pr(lt, e.qr + 0.2, e.qr + 0.6) : 0, step2 ? (1 - pr(lt, e.qr + 0.2, e.qr + 0.6)) * 60 : 0);
    const sc = (lt - e.qr - 0.5) / 0.6; set(R.ln, 1, 0, 3 + Math.abs(Math.sin(sc * Math.PI)) * 50);
    set(R.ok, step2 ? pr(lt, e.ok, e.ok + 0.25) : 0, 0, 0, 0.8 + 0.2 * back((lt - e.ok) / 0.35));
  },
  notify(lt, d, s) {

    const e = s.ev;
    R.toasts.forEach((tt, i) => {

    });

    const mp = pr(lt, e.click - 0.75, e.click - 0.05), cOn = lt > e.click - 0.85 && lt < e.click + 0.5;
    R.cursor.style.left = (sx + (cx - sx) * mp) + 'px'; R.cursor.style.top = (sy + (cy - sy) * mp) + 'px';
    set(R.cursor, cOn ? Math.min(pr(lt, e.click - 0.85, e.click - 0.6), 1 - pr(lt, e.click + 0.3, e.click + 0.5)) : 0, 0, 0, lt > e.click && lt < e.click + 0.15 ? 0.85 : 1);
    const rp = clamp((lt - e.click) / 0.45); R.ripple.style.left = cx + 'px'; R.ripple.style.top = cy + 'px'; set(R.ripple, rp > 0 && rp < 1 ? 1 - rp : 0, 0, 0, 0.4 + rp * 1.2);
    // chat
    const chOn = lt >= e.click + 0.15; set(R.chat, chOn ? pr(lt, e.click + 0.15, e.click + 0.45) : 0);
    let hidden = 0;
    R.items.forEach((it) => {
      const at = e[it.ev], p = pr(lt, at, at + 0.35); hidden += it.h * (1 - p);
      if (it.reveal) { set(it.n, p > 0 ? 1 : 0); it.n.style.clipPath = `inset(0 ${(100 - 100 * pr(lt, at, at + 0.6)).toFixed(1)}% 0 0)`; }
      else set(it.n, p, 0, 0, 0.85 + 0.15 * back((lt - at) / 0.35));

    });

    const chars = Array.from(T.chat.reply);
    if (lt >= e.type && lt < e.out) {

    } else R.box.innerHTML = `<span class="phd">${esc(T.chat.placeholder)}</span>`;
    const sp = lt - (e.out - 0.15); set(R.sendB, 1, 0, 0, sp > 0 && sp < 0.35 ? 1 - Math.sin(sp / 0.35 * Math.PI) * 0.18 : 1);
    const sa = e.out + 0.2, sOn = lt >= sa && lt < sa + 1.8, h = sOn ? R.sentHTML : R.pairHTML;
    if (R.pair.innerHTML !== h) R.pair.innerHTML = h;
    R.pair.classList.toggle('sent', sOn); set(R.pair, 1, 0, 0, sOn ? 1 + 0.12 * (1 - pr(lt, sa, sa + 0.35)) : 1);
  },
  proof(lt, d, s) {
    set(R.proT, pr(lt, 0.05, 0.4), 0, (1 - pr(lt, 0.05, 0.4)) * 18);
    [...R.who.children].forEach((c, i) => { const a = 0.3 + i * 0.2; set(c, pr(lt, a, a + 0.35), 0, (1 - pr(lt, a, a + 0.35)) * 22, 0.85 + 0.15 * back((lt - a) / 0.4)); });
    set(R.who, 1);
    [...R.chk.children].forEach((c, i) => { const a = 1.7 + i * 0.3; set(c, pr(lt, a, a + 0.35), (1 - pr(lt, a, a + 0.35)) * -24, 0); });
    set(R.chk, 1);

  end(lt, d, s) {

    R.minis.forEach((m, i) => { const a = 0.35 + i * 0.08; set(m, pr(lt, a, a + 0.25), 0, 0, 0.5 + 0.5 * back((lt - a) / 0.3)); });
    set(R.cta, 1, 0, 0, 1 + Math.max(0, Math.sin((lt - 1.0) * 4.2)) * 0.05 * pr(lt, 1.0, 1.3));

};

function seekAd(t) {
  t = Math.min(t, D.duration - 0.001);
  R.blobs.forEach((b, i) => { b.style.transform = `translate(${(Math.sin(t * 0.5 + i * 2) * 30).toFixed(1)}px, ${(Math.cos(t * 0.4 + i) * 24).toFixed(1)}px)`; });
  const cur = SEC.find((x) => t < x.start + x.dur) || SEC[SEC.length - 1];
  SEC.forEach((s) => {
    const on = s === cur, lt = t - s.start;
    const a = on ? Math.min(pr(lt, 0, 0.3), s.id === 'end' ? 1 : 1 - pr(lt, s.dur - 0.25, s.dur)) : 0;
    set(G[s.id], a); if (on) F[s.id](lt, s.dur, s);
  });
  const hk = S('hook'), br = S('brand'), ad_ = S('add'), nt = S('notify');
  // phones: pop in and buzz, then fly into the window tabs
  R.phones.forEach((p, i) => {
    const [, , rot] = L.phones[i];
    if (cur === hk) {
      const lt = t - hk.start, at = hk.ev.ph[i], a = pr(lt, at, at + 0.3);
      const buzz = Math.sin(lt * 50 + i * 3) * 2.6 * (0.5 + 0.5 * Math.sin(lt * 3 + i));
      set(p, a, buzz, (1 - a) * 40, 0.7 + 0.3 * back((lt - at) / 0.4), rot + buzz * 0.8);
      set(p.querySelector('.bd'), pr(lt, at + 0.3, at + 0.5), 0, 0, 0.4 + 0.6 * back((lt - at - 0.3) / 0.3));
    } else if (cur === br && t - br.start < 0.85) {
      const lt = t - br.start, k = eo((lt - 0.1 - i * 0.06) / 0.6), [cx, cy] = R.phC[i], [tx, ty] = R.tabC[i];
      set(p, 1 - pr(lt, 0.45 + i * 0.06, 0.7 + i * 0.06), (tx - cx) * k, (ty - cy) * k, 1 - 0.85 * k, rot * (1 - k));
    } else set(p, 0);
  });
  // window
  const wOn = t >= br.start && t < nt.start + nt.dur;
  const wa = wOn ? Math.min(pr(t, br.start, br.start + 0.4), 1 - pr(t, nt.start + nt.dur - 0.3, nt.start + nt.dur)) : 0;
  set(R.win, wa, 0, wOn ? (1 - pr(t, br.start, br.start + 0.45)) * 50 : 0, wOn ? 0.95 + 0.05 * pr(t, br.start, br.start + 0.45) : 1);
  const { n, act } = tabsAt(t);
  R.tabs.forEach((tb, i) => {
    let at = br.start + 0.45 + i * 0.07;
    if (i === 5) at = ad_.start + ad_.ev.tab6; if (i > 5) at = ad_.start + ad_.ev.more[i - 6];
    set(tb, i < n ? pr(t, at, at + 0.25) : 0, 0, 0, i < n ? 0.6 + 0.4 * back((t - at) / 0.3) : 1);
    tb.classList.toggle('on', i === act); tb.querySelector('.bar').style.display = i === act ? 'block' : 'none';
    const un = tb.querySelector('.un'); let u = 0;
    T.toasts.forEach((x, k) => { if (x.tab === i && t >= nt.start + nt.ev.toasts[k] && t < nt.start + nt.ev.click + (i === 5 ? 0 : 99)) u++; });
    if (i < 5 && i !== 1 && t >= br.start + 1 && t < nt.start) u = [3, 0, 2, 5, 4][i];
    un.style.display = u ? 'grid' : 'none'; un.textContent = u;
  });
  // keep the newest tab in view (tabs scroll under the + button)
  const lastI = Math.max(0, n - 1), right = R.tabX[lastI][0] + R.tabX[lastI][1] * pr(t, 0, 0) + 0;
  const want = Math.max(0, R.tabX[lastI][0] + R.tabX[lastI][1] - (L.winW - 58));
  R.trow.style.transform = `translateX(${(-want).toFixed(1)}px)`;
  // account counter while tabs are being added
  const cOn = t >= ad_.start + ad_.ev.tab6 && t < ad_.start + ad_.dur;
  if (cOn) { const txt = T.add.count.replace('{n}', n); if (R.count.textContent !== txt) R.count.textContent = txt; }
  R.count.style.left = (W - 30 - R.count.offsetWidth) + 'px'; R.count.style.top = (L.winTop - 18) + 'px';
  set(R.count, cOn ? Math.min(pr(t, ad_.start + ad_.ev.tab6, ad_.start + ad_.ev.tab6 + 0.3), 1 - pr(t, ad_.start + ad_.dur - 0.3, ad_.start + ad_.dur)) : 0, 0, 0,
      cOn ? 1 + 0.08 * Math.max(0, 1 - ((t - ad_.start - ad_.ev.more.filter((m) => t - ad_.start >= m).slice(-1)[0] || 0) / 0.2)) : 1);
  // window body: splash (brand) / list (add + notify before the click)
  set(R.splash, cur === br ? pr(t, br.start + 0.4, br.start + 0.8) : 0, 0, 0, cur === br ? 0.8 + 0.2 * back((t - br.start - 0.4) / 0.5) : 1);
  set(R.list, cur === ad_ || (cur === nt && t < nt.start + nt.ev.click + 0.4) ? 1 : 0);
  if (cur !== ad_) { set(R.dim, 0); set(R.modal, 0); }
  if (cur !== nt) { R.toasts.forEach((x) => set(x, 0)); set(R.cursor, 0); set(R.ripple, 0); set(R.chat, 0); }
  if (R.mark) set(R.mark, ['add', 'notify', 'proof'].includes(cur.id) ? 1 : 0);
  // subtitles
  const cap = cur.showCaps ? cur.caps.find((c) => t >= c.t0 - 0.05 && t < c.t1 + 0.25) : null;
  if (cap && R.capSpan.textContent !== cap.show) R.capSpan.textContent = cap.show;
  set(R.cap, cap ? Math.min(pr(t, cap.t0 - 0.05, cap.t0 + 0.15), 1 - pr(t, cap.t1 + 0.1, cap.t1 + 0.25)) : 0);
}
window.seekAd = seekAd; window.READY = false;
fetch(`multi-${LANG}.json?ts=${Date.now()}`).then((r) => r.json()).then((d) => { D = d; build(); })
  .then(() => Promise.all([...document.images].map((im) => (im.complete ? 1 : new Promise((ok) => { im.onload = im.onerror = ok; })))))
  .then(() => document.fonts.ready)
  .then(() => { measure(); window.READY = true; seekAd(0);
    if (!Q.get('record')) { const t0 = performance.now(); (function loop() { seekAd(((performance.now() - t0) / 1000) % D.duration); requestAnimationFrame(loop); })(); } });
</script>
